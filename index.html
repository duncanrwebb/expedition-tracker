<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Expedition Log</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  /* Every colour below comes from the trip config's `theme` block, injected as
     custom properties at startup. Nothing here is trip-specific — swap the
     config and the whole app re-skins. */
  :root {
    --fs: 1;   /* viewer's text size, set from the Aa control; see applyTextSize() */
    --primary:#1B4332; --primary-deep:#123324; --accent:#C9A66B;
    --bg:#F6F1E7; --surface:#FBF8F1; --text:#1F2421; --text-body:#3A3F3B;
    --text-muted:#6B6455; --border:#E4DCC8; --border-strong:#C9BFA6;
    --past:#B8AE99; --success:#3F7248; --warning:#8A6D3B; --alert:#A63D40;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px; }
  a { color:var(--alert); }

  .hero { background:linear-gradient(180deg,var(--primary) 0%,var(--primary-deep) 100%); color:var(--bg); padding:28px 20px 24px; border-radius:24px; margin-top:2px; }
  .eyebrow { font-family:'JetBrains Mono',monospace; font-size:calc(14px * var(--fs)); letter-spacing:1.5px; text-transform:uppercase; color:var(--accent); }
  h1.title { font-family:'Fraunces',serif; font-size:calc(34px * var(--fs)); font-weight:700; margin:6px 0 4px; line-height:1.1; }
  .subtitle { font-size:calc(17px * var(--fs)); opacity:.85; margin:0 0 16px; }
  .progress-label { font-family:'JetBrains Mono',monospace; font-size:calc(16px * var(--fs)); margin-bottom:6px; }
  .progress-track { height:8px; background:rgba(255,255,255,.15); border-radius:8px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--accent); border-radius:8px; transition:width .4s ease; }
  main { padding:22px 16px 0; max-width:640px; margin:0 auto; }

  .tabbar-wrap { position:sticky; top:0; z-index:20; display:flex; align-items:center; background:var(--bg); border-bottom:1.5px solid var(--border); }
  .tabbar-wrap .tabbar { flex:1; min-width:0; border-bottom:0; }
  /* Deliberately not scaled with --fs: it has to stay findable by exactly the
     people whose text is currently too small to read. */
  .textsize-btn { flex-shrink:0; margin-right:10px; min-width:44px; min-height:44px; border-radius:22px;
    border:1.5px solid var(--border-strong); background:#fff; color:var(--text-body); cursor:pointer;
    font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:700; }
  .textsize-btn[aria-expanded="true"] { background:var(--primary); border-color:var(--primary); color:var(--bg); }
  .textsize-panel { position:absolute; right:10px; top:calc(100% + 6px); background:#fff; border:1.5px solid var(--border-strong);
    border-radius:14px; box-shadow:0 6px 20px rgba(0,0,0,.16); padding:12px; width:min(280px, calc(100vw - 20px)); }
  .textsize-panel h2 { font-size:17px; margin:0 0 8px; font-family:'Inter',sans-serif; color:var(--text); }
  .textsize-panel .ts-opts { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
  /* Each option shows the size it sets — the choice is visible, not described. */
  .textsize-panel button { min-height:52px; border-radius:10px; border:1.5px solid var(--border-strong); background:#fff;
    cursor:pointer; font-family:'Fraunces',Georgia,serif; font-weight:700; color:var(--text-body); line-height:1; }
  .textsize-panel button[aria-pressed="true"] { background:var(--primary); border-color:var(--primary); color:var(--bg); }
  .textsize-panel p { font-size:15px; margin:10px 0 0; color:var(--text-muted); line-height:1.45; }
  .tabbar { position:relative; display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; background:var(--bg); border-bottom:1.5px solid var(--border); padding:10px 12px; scrollbar-width:none; }
  .tabbar::-webkit-scrollbar { display:none; }
  .tab-btn { flex-shrink:0; background:#fff; border:1.5px solid var(--border-strong); border-radius:20px; padding:9px 16px; font-size:calc(14px * var(--fs)); font-weight:600; color:var(--text-body); cursor:pointer; min-height:44px; font-family:'Inter',sans-serif; white-space:nowrap; }
  .tab-btn[aria-selected="true"] { background:var(--primary); border-color:var(--primary); color:var(--bg); }
  .tab-panel { display:none; }
  .tab-panel.active { display:block; }

  h3.section { font-family:'Fraunces',serif; font-size:calc(22px * var(--fs)); margin:26px 0 12px; }
  #mapWrapper { position:relative; }
  /* left:50%+transform centers the map even when it's been resized wider than its
     container — margin:auto gets clamped to zero by browsers once a box is wider
     than its parent, which was the actual bug the first time this was tried. */
  #map { height:380px; border-radius:16px; border:1.5px solid var(--border); position:relative; left:50%; transform:translateX(-50%); }
  .map-resize-handle { display:none; position:absolute; right:6px; bottom:6px; width:30px; height:30px; border-radius:8px; background:var(--primary); color:#fff; align-items:center; justify-content:center; font-size:16px; cursor:nwse-resize; z-index:500; user-select:none; box-shadow:0 2px 6px rgba(0,0,0,.3); opacity:.85; }
  @media (pointer: fine) { .map-resize-handle { display:flex; } }
  .map-resize-handle:hover { opacity:1; }
  .map-controls { background:var(--surface); border:1.5px solid var(--border); border-top:none; border-bottom-left-radius:16px; border-bottom-right-radius:16px; padding:12px 14px; margin-top:-1px; }
  .map-controls .chip-row { display:flex; flex-wrap:wrap; gap:8px; }
  .map-controls .chip { display:flex; align-items:center; gap:6px; font-size:calc(16px * var(--fs)); padding:11px 14px; border-radius:22px; border:1.5px solid var(--border-strong); background:#fff; cursor:pointer; user-select:none; min-height:44px; }
  .map-controls .chip.off { opacity:.45; text-decoration:line-through; }
  .map-controls .chip input { position:absolute; width:1px; height:1px; opacity:0; clip:rect(0 0 0 0); }
  .map-controls .hint { font-size:calc(14px * var(--fs)); color:var(--text-muted); margin:0 0 8px; }
  .leaflet-popup-content { font-family:'Inter',sans-serif; font-size:calc(16px * var(--fs)); max-width:200px; }
  .leaflet-popup-content b { font-family:'Fraunces',serif; font-size:calc(17px * var(--fs)); }

  .day-row { display:flex; gap:14px; margin-bottom:12px; }
  .past-days-toggle { display:block; width:100%; text-align:left; background:var(--surface); border:1.5px dashed var(--border-strong); border-radius:12px; padding:12px 16px; font-size:calc(14px * var(--fs)); font-weight:600; color:var(--text-muted); cursor:pointer; margin-bottom:12px; font-family:'Inter',sans-serif; min-height:44px; }
  .dot { flex-shrink:0; width:34px; height:34px; border-radius:50%; border:2px solid var(--primary); background:#fff; font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .dot.today { background:var(--primary); color:#fff; }
  .dot.past { background:var(--past); border-color:var(--past); }
  .day-card { flex:1; background:var(--surface); border:1.5px solid var(--border-strong); border-radius:14px; padding:12px 14px; cursor:pointer; }
  .day-card.today { border-color:var(--primary); }
  .day-head { display:flex; justify-content:space-between; font-size:calc(14px * var(--fs)); }
  .day-date { font-family:'JetBrains Mono',monospace; color:var(--text-muted); }
  .phase-tag { font-weight:600; }
  .day-loc { font-size:calc(18px * var(--fs)); font-weight:600; margin-top:4px; }
  .day-body { margin-top:10px; display:none; }
  .day-body.open { display:block; }
  .day-photo { width:100%; height:130px; object-fit:cover; border-radius:10px; margin-bottom:8px; }
  .day-summary { font-size:calc(16px * var(--fs)); line-height:1.5; margin:0 0 8px; color:var(--text-body); }

  .current-card { background:#fff; color:var(--text); border-radius:18px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,.25); margin-top:14px; }
  .current-card img { width:100%; height:150px; object-fit:cover; display:block; }
  .current-card .inner { padding:16px; }
  .phase-pill { display:inline-block; color:#fff; font-size:calc(14px * var(--fs)); font-weight:600; padding:3px 10px; border-radius:20px; margin-bottom:8px; }
  .current-loc { font-family:'Fraunces',serif; font-size:calc(24px * var(--fs)); margin:0 0 6px; }
  .countdown-row { display:flex; gap:10px; margin:14px 0 0; }
  .countdown-box { flex:1; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 12px; text-align:center; }
  .countdown-num { font-family:'Fraunces',serif; font-size:calc(25px * var(--fs)); font-weight:700; color:var(--accent); line-height:1.1; white-space:nowrap; }
  .countdown-lbl { font-size:calc(14px * var(--fs)); opacity:.8; margin-top:4px; }
  .there-now { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:12px; padding:10px 14px; margin-top:10px; font-size:calc(16px * var(--fs)); line-height:1.5; }
  .there-now .tn-head { font-family:'JetBrains Mono',monospace; font-size:calc(14px * var(--fs)); letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-bottom:3px; }
  .fun-fact { background:#FFF9EC; border:1.5px dashed var(--accent); border-radius:10px; padding:8px 12px; font-size:calc(15px * var(--fs)); line-height:1.5; margin-top:8px; color:var(--text-body); }
  .fun-fact b { color:var(--warning); }
  .key-dates { margin-top:10px; display:flex; flex-direction:column; gap:6px; }
  .key-date { display:flex; align-items:flex-start; gap:10px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:9px 12px; font-size:calc(15px * var(--fs)); }
  .key-date.done { opacity:.45; text-decoration:line-through; }
  .key-date .kd-when { font-family:'JetBrains Mono',monospace; font-size:calc(13px * var(--fs)); color:var(--accent); flex:0 0 88px; line-height:1.4; padding-top:1px; }
  .key-date .kd-label { flex:1; line-height:1.4; }
  /* At large text sizes a fixed 88px date column holds about four characters a
     line, so "Mon 20 Jul, ~10:40 UK time" stacked into four ragged rows. Put the
     date above the event instead, where it gets the full width. */
  .ts-large .key-date { flex-direction:column; gap:3px; }
  .ts-large .key-date .kd-when { flex:none; }
  .right-now { background:#EFF5EF; border-left:4px solid var(--success); border-radius:8px; padding:8px 12px; font-size:calc(16px * var(--fs)); line-height:1.5; margin:8px 0; }
  .quiet { background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); border-left:4px solid var(--accent);
    border-radius:10px; padding:10px 14px; margin-top:10px; font-size:calc(15px * var(--fs)); line-height:1.5; }
  .quiet-head { font-family:'JetBrains Mono',monospace; font-size:calc(13px * var(--fs)); letter-spacing:.6px; text-transform:uppercase;
    color:var(--accent); margin-bottom:4px; }
  .quiet-next { margin-top:5px; font-size:calc(14px * var(--fs)); opacity:.95; }
  .updated-note { font-size:calc(13px * var(--fs)); color:var(--text-muted); margin-top:10px; }
  .updated-note.stale { color:var(--warning); font-weight:600; }

  .trek-progress { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:16px 18px; }
  .trek-progress h4 { font-family:'Fraunces',serif; font-size:calc(19px * var(--fs)); margin:0 0 4px; }
  .trek-sub { font-size:calc(14px * var(--fs)); color:var(--text-muted); margin:0 0 10px; }
  .trek-track { height:14px; background:var(--border); border-radius:10px; overflow:hidden; position:relative; }
  .trek-fill { height:100%; background:linear-gradient(90deg,var(--success),var(--primary)); border-radius:10px; transition:width .5s ease; }
  .trek-boots { position:absolute; top:-4px; font-size:calc(18px * var(--fs)); transform:translateX(-50%); transition:left .5s ease; }
  .trek-stats { display:flex; justify-content:space-between; font-family:'JetBrains Mono',monospace; font-size:calc(14px * var(--fs)); color:var(--text-muted); margin-top:6px; }
  .trek-note { font-size:calc(12.5px * var(--fs)); color:var(--text-muted); line-height:1.5; margin:10px 0 0; padding-top:8px; border-top:1px dashed var(--border-strong); }

  .info-card { background:var(--surface); border:1.5px solid var(--border-strong); border-radius:14px; padding:14px 16px; margin-bottom:12px; }
  .info-card h4 { font-family:'Fraunces',serif; font-size:calc(16px * var(--fs)); margin:0 0 6px; display:flex; align-items:center; gap:6px; }
  .info-card p, .info-card .placeholder { font-size:calc(15px * var(--fs)); line-height:1.6; margin:0 0 8px; color:var(--text-body); white-space:pre-wrap; }
  .info-card .placeholder { color:var(--text-muted); font-style:italic; }
  .info-card textarea, .info-card input[type=url], .info-card input[type=text] { width:100%; border-radius:8px; border:1.5px solid var(--border-strong); padding:8px 10px; font-size:calc(16px * var(--fs)); font-family:'Inter',sans-serif; resize:vertical; margin-bottom:8px; }
  .gal-strip { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:10px; }
  .gal-th, .gal-cell { padding:0; border:0; background:var(--border-strong); border-radius:8px; overflow:hidden; aspect-ratio:1; cursor:pointer; }
  .gal-th img, .gal-cell img { width:100%; height:100%; object-fit:cover; display:block; }
  .gal-over { position:fixed; inset:0; z-index:9500; background:var(--bg); display:flex; flex-direction:column; }
  .gal-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; padding-top:max(10px, env(safe-area-inset-top)); border-bottom:1px solid var(--border-strong); }
  .gal-grid { flex:1; overflow-y:auto; display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:4px; padding:4px; align-content:start; -webkit-overflow-scrolling:touch; }
  .gal-x { background:none; border:0; font-size:22px; line-height:1; padding:8px 12px; color:inherit; cursor:pointer; min-width:44px; min-height:44px; }
  .gal-big { position:absolute; inset:0; background:#000; display:flex; align-items:center; justify-content:center; }
  .gal-big[hidden] { display:none; }
  .gal-big img { max-width:100%; max-height:100%; object-fit:contain; }
  .gal-big .gal-x { position:absolute; top:max(6px, env(safe-area-inset-top)); right:6px; color:#fff; z-index:2; }
  .gal-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.35); color:#fff; border:0; font-size:34px; line-height:1; width:44px; height:64px; cursor:pointer; z-index:2; }
  .gal-nav.prev { left:0; border-radius:0 8px 8px 0; } .gal-nav.next { right:0; border-radius:8px 0 0 8px; }
  .gal-cap { position:absolute; left:0; right:0; bottom:0; padding:10px 14px; padding-bottom:max(10px, env(safe-area-inset-bottom)); display:flex; justify-content:space-between; gap:12px; color:#fff; background:linear-gradient(transparent, rgba(0,0,0,.6)); font-size:14px; }
  .gal-cap a { color:#fff; font-weight:600; }
  .map-photo { width:40px; height:40px; border-radius:8px; border:2px solid #fff; box-shadow:0 1px 5px rgba(0,0,0,.45); background:#ccc center/cover; position:relative; cursor:pointer; }
  .map-photo::after { content:""; position:absolute; left:50%; bottom:-10px; margin-left:-6px; border:6px solid transparent; border-top-color:#fff; border-bottom:0; height:4px; }
  .map-photo span { position:absolute; top:-8px; right:-8px; background:var(--primary); color:#fff; border-radius:10px; padding:0 6px; font:600 11px/18px Inter,sans-serif; border:1.5px solid #fff; }
  .card-btn { background:var(--primary); color:var(--bg); border:none; border-radius:8px; padding:9px 14px; font-weight:600; font-size:calc(14px * var(--fs)); cursor:pointer; min-height:40px; }
  .card-btn.secondary { background:none; color:var(--primary); border:1.5px solid var(--primary); }
  .card-btn.link { display:inline-block; background:var(--primary); color:var(--bg); text-decoration:none; border-radius:8px; padding:9px 14px; font-weight:600; font-size:calc(14px * var(--fs)); text-align:center; }
  .card-btn.link.secondary { background:none; color:var(--primary); border:1.5px solid var(--primary); }
  .portal-btn-group { display:flex; flex-direction:column; gap:8px; }
  .portal-btn { display:block; width:100%; }

  .flight-row { border-top:1px solid var(--border); padding:12px 0; font-size:calc(14px * var(--fs)); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .flight-row:first-of-type { border-top:none; padding-top:0; }
  .flight-info { flex:1; min-width:180px; }
  .flight-main { font-size:calc(15px * var(--fs)); }
  .flight-times { color:var(--text-muted); font-family:'JetBrains Mono',monospace; font-size:calc(12.5px * var(--fs)); margin-top:3px; }
  .flight-status { font-weight:600; margin-top:3px; font-size:calc(13px * var(--fs)); }
  .flight-row.live .flight-status { color:var(--success); }
  .flight-row.done .flight-status { color:var(--warning); }
  .flight-row.landed .flight-status { color:var(--success); }
  /* Next up: the one thing on now or next, for the people travelling. */
  .next-up { background:var(--surface); border:1.5px solid var(--primary); border-radius:14px; padding:14px 16px; margin:0 0 14px; }
  .next-up .quiet-head { color:var(--primary); }
  .next-title { font-family:'Fraunces',serif; font-size:calc(20px * var(--fs)); line-height:1.25; color:var(--text); margin:2px 0; }
  .next-when { font-weight:600; color:var(--text-body); font-size:calc(15px * var(--fs)); }
  .next-where { color:var(--text-muted); font-size:calc(14px * var(--fs)); margin-top:2px; }
  .next-actions { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  .next-btn, .cal-add { font:600 calc(13px * var(--fs))/1.2 inherit; text-decoration:none; color:var(--primary);
    border:1.5px solid var(--border-strong); background:var(--surface); border-radius:16px; padding:5px 10px; cursor:pointer; white-space:nowrap; }
  .next-btn:focus-visible, .cal-add:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
  /* Cancelled or diverted — the one status a parent must not miss. */
  .flight-row.alert .flight-status { color:var(--alert); }
  /* Segmented control for the "whose local time?" toggle */
  .seg { display:inline-flex; border:1.5px solid var(--border-strong); border-radius:20px; overflow:hidden; background:#fff; }
  .seg button { border:none; background:none; font-family:'Inter',sans-serif; font-size:calc(12.5px * var(--fs)); font-weight:600;
    color:var(--text-muted); padding:7px 12px; cursor:pointer; min-height:34px; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--primary); color:var(--bg); }
  .seg-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; font-size:calc(13px * var(--fs)); color:var(--text-muted); }

  .flight-track-btn { background:#fff; color:var(--primary); border:1.5px solid var(--primary); white-space:nowrap; flex-shrink:0; }
  .flight-track-btn-live { background:var(--success); color:var(--bg); border-color:var(--success); animation:flightPulse 1.8s ease-in-out infinite; }
  @keyframes flightPulse { 0%,100%{ box-shadow:0 0 0 0 rgba(63,114,72,.5); } 50%{ box-shadow:0 0 0 7px rgba(63,114,72,0); } }

  /* Accommodation / car hire — only rendered when the config has them. */
  .stay { border-top:1px solid var(--border); padding:11px 0; }
  .stay:first-of-type { border-top:none; padding-top:0; }
  /* "Been" is the strongest thing a list entry can say once a trip is over —
     it separates what was actually done from what was only ever considered.
     A chip on its own was too easy to lose in a list of twenty, so the whole
     row carries it. Declared BEFORE .current so that on the rare entry which
     is both, where-you-are-now still wins. */
  .stay.been { background:#EDF3ED; border-left:4px solid var(--success); border-radius:8px; padding-left:10px; margin:4px 0; }
  .stay.been .stay-name { color:var(--success); }
  .stay.current { background:#EFF5EF; border-left:4px solid var(--success); border-radius:8px; padding-left:10px; margin:4px 0; }
  .stay-when { font-family:'JetBrains Mono',monospace; font-size:calc(12.5px * var(--fs)); color:var(--text-muted); }
  .stay-name { font-size:calc(15px * var(--fs)); font-weight:600; margin-top:2px; }
  .stay-note { font-size:calc(13.5px * var(--fs)); color:var(--text-muted); line-height:1.5; margin-top:3px; }

  .notes-section { background:var(--surface); border:1.5px solid var(--border); border-radius:16px; padding:18px; }
  .notes-hint { font-size:calc(16px * var(--fs)); color:var(--text-muted); line-height:1.5; }
  .note-input-row { display:flex; gap:8px; margin:8px 0 14px; }
  textarea#noteInput { flex:1; border-radius:10px; border:1.5px solid var(--border); padding:10px; font-size:calc(16px * var(--fs)); font-family:'Inter',sans-serif; resize:vertical; }
  button#saveNote { background:var(--primary); color:var(--bg); border:none; border-radius:10px; padding:0 20px; font-weight:600; font-size:calc(17px * var(--fs)); cursor:pointer; min-height:44px; }
  .note-item { background:#fff; border-radius:10px; padding:8px 12px; border:1px solid var(--border); margin-bottom:8px; }
  .note-item-row { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .note-text { flex:1; white-space:pre-wrap; }

<script>
// Loads the trip config before the engine runs.
//   ?preview=1     — render the Trip Builder's unsaved draft, so an organiser can
//                    see exactly what they're about to publish before publishing it.
//   ?trip=texas    — load trips/texas/trip-config.js. How you work from the repo,
//                    where every trip has its own folder. (?config= is the old
//                    name for the same thing and still works.)
//   (neither)      — trip-config.js beside this file. That is the live case: a
//                    published site holds the engine plus ONE trip folder's
//                    contents, copied in by deploy/publish-trip.sh, and nothing
//                    else — so there is no other trip it could load.
// TRIP_DIR is the folder the config came from. Files the config names by a
// relative path (the costs file, a ticket PDF) live in that same folder.
// document.write is deliberate for the file case: it's the one way to pull in a
// script synchronously with no build step and no async bootstrapping, and it
// behaves the same over file:// and http://.
(function(){
  var q = new URLSearchParams(location.search);
  window.TRIP_DIR = "";
  if (q.get("preview") === "1"){
    try {
      var draft = localStorage.getItem("tripbuilder-preview");
      if (draft){ window.TRIP = JSON.parse(draft); window.__PREVIEW__ = true; return; }
    } catch(e){}
  }
  var v = q.get("trip") || q.get("config");
  if (v && /^[a-z0-9-]+$/i.test(v)) window.TRIP_DIR = "trips/" + v + "/";
  document.write('<script src="' + window.TRIP_DIR + 'trip-config.js"><\/script>');
})();
</script>
<script>
// Optional costs file, named by the config's `costsFile`. Kept separate and
// git-ignored: GitHub Pages serves a public URL even from a private repo, so
// real amounts must never sit in the committed config.
(function(){
  if (typeof TRIP === "undefined" || !TRIP.costsFile) return;
  if (!/^[a-z0-9.\-]+\.js$/i.test(TRIP.costsFile)) return;
  document.write('<script src="' + window.TRIP_DIR + TRIP.costsFile + '"><\/script>');
})();
</script>
<script>
/* ===========================================================================
   DEMO CLOCK — only ever active when the loaded config declares `demo.enabled`.
   Absent from every real trip config, so this is inert in normal use.

   WHY IT LIVES HERE, BETWEEN THE CONFIG AND THE ENGINE:
   The engine reads the real clock in ~15 places and runs 17 IIFEs once on load
   that write straight into the DOM. There is no single "today" to override.
   Rather than refactor 17 working IIFEs into re-callable functions — on an app
   in daily use by a family abroad — this shifts `Date` itself before any of
   them run. Every clock read then recomputes naturally against the demo date,
   and nothing downstream needs to know. Scrubbing reloads the page, so the two
   can never drift out of sync.

   This script must stay ABOVE the engine and BELOW the config: it needs
   TRIP.trip.destinationTimeZone, and nothing may have read the clock yet.
   =========================================================================== */
(function(){
  if (typeof TRIP === "undefined" || !TRIP.demo || !TRIP.demo.enabled) return;

  var RealDate = Date;
  var q = new URLSearchParams(location.search);
  var D = TRIP.demo;

  /* Story mode. `beat` is 1-indexed and wins over `demo`, because a beat IS a
     date plus whether the scripted update has been published by that point.
     A clean open with no parameters starts the story at beat 1 — that is the
     state a pitch link should land in. Dragging the scrubber clears `beat`,
     which is how you leave the running order and explore freely. */
  var story     = Array.isArray(D.story) && D.story.length ? D.story : null;
  var dateStr   = q.get("demo");
  var hasDate   = /^\d{4}-\d{2}-\d{2}$/.test(dateStr || "");
  var beatParam = parseInt(q.get("beat"), 10);
  var beat      = null;

  if (story){
    if (beatParam >= 1 && beatParam <= story.length) beat = beatParam;
    else if (!hasDate) beat = 1;
  }
  if (beat){
    dateStr = story[beat - 1].date;
    hasDate = true;
  }
  if (!hasDate) dateStr = D.defaultDate;

  /* The instant that is `hms` on `ds` in the destination's timezone.

     Iterating converges because we cannot construct a Date directly in a named
     zone: we guess, ask what destination wall-clock the guess represents, and
     correct by the difference. Two passes is enough; three is free insurance
     across DST boundaries. Uses RealDate throughout — the shim is not installed
     until after this has run. */
  function instantAtDestLocal(ds, tz, hms){
    var guess = new RealDate(ds + "T" + hms + "Z");
    for (var i = 0; i < 3; i++){
      var asDest    = new RealDate(guess.toLocaleString("en-US", { timeZone: tz }));
      var wantLocal = new RealDate(ds + "T" + hms);
      guess = new RealDate(guess.getTime() + (wantLocal - asDest));
    }
    return guess;
  }

  var TZONE = TRIP.trip.destinationTimeZone || "UTC";

  /* Keep the real time of day, move only the date. The "over there right now"
     clock then reads true and ticks while the page is open, and the "right now
     they're probably…" line tracks the actual hour in Cambodia — which matters
     in a demo whose whole subject is time. An anchor at a fixed hour would show
     the same frozen clock at every scrub position.

     The day index stays exact by construction: the destination-local date of
     the shifted instant is `ds` by definition, because we set the destination
     wall-clock to the time it already is there. The resulting offset is a whole
     number of days, so nothing drifts.

     hourCycle h23 rather than hour12:false — the latter renders midnight as
     "24:00:00" in some engines, which would parse as the following day. */
  var hms = new Intl.DateTimeFormat("en-GB", {
    timeZone: TZONE, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23"
  }).format(new RealDate());

  var target = instantAtDestLocal(dateStr, TZONE, hms);
  if (isNaN(target.getTime())) return;          // bad date — leave the real clock alone
  var OFFSET = target.getTime() - RealDate.now();

  /* Subclassing rather than wrapping keeps `instanceof Date` true and leaves
     every Date method, including the Intl formatting the engine leans on,
     exactly as it was. Only the no-argument constructor and `now()` move. */
  var DemoDate = class extends RealDate {
    constructor(){
      if (arguments.length === 0) super(RealDate.now() + OFFSET);
      else super(...arguments);
    }
    static now(){ return RealDate.now() + OFFSET; }
  };
  DemoDate.parse = RealDate.parse;
  DemoDate.UTC   = RealDate.UTC;
  window.Date = DemoDate;

  /* Keep "Itinerary last updated …" plausible at whatever date the scrubber is
     on. A config's `updated` is a fixed date; scrub behind it and the app would
     claim to have been updated in the future. */
  if (D.updatedLagDays != null){
    var lag = new RealDate(dateStr + "T12:00:00Z");
    lag.setUTCDate(lag.getUTCDate() - D.updatedLagDays);
    var lagStr = lag.toISOString().slice(0, 10);
    TRIP.trip.updated = (D.updatedFloor && lagStr < D.updatedFloor) ? D.updatedFloor : lagStr;
  }

  /* Demo #2: the scripted update. Applied to TRIP before the engine reads it,
     which is precisely what editing the config file and redeploying would have
     done — same object, same fields, same render path. TRIP is freshly parsed
     on every load, so mutating it here cannot leak into the next one. */
  /* Updates are CUMULATIVE and in trip order, which is why the published state
     is a COUNT rather than a set of ids: a change that has gone out stays out,
     so "the first two have landed" says everything there is to say about where
     the trip has got to. It also keeps the URL something you can read off a
     projector — ?update=2, not a comma-separated list of slugs.

     A beat's `updates: N` and `?update=N` mean the same thing and the larger
     wins. That is what lets you publish from inside a beat which arrives in
     the before state, without dropping out of the running order. */
  var UPDATES = Array.isArray(D.updates) ? D.updates
              : (D.update ? [D.update] : []);        // configs written before this was a list
  var published = Math.max(beat ? (story[beat - 1].updates | 0) : 0,
                           parseInt(q.get("update"), 10) || 0);
  published = Math.max(0, Math.min(published, UPDATES.length));

  UPDATES.slice(0, published).forEach(function(upd){
    if (!upd || !upd.patch) return;
    if (upd.patch.trip) Object.assign(TRIP.trip, upd.patch.trip);
    /* Whole-array replace rather than a merge. A rebooking changes which
       flights exist, not just their times: the missed connection disappears
       and two new legs take its place, so there is no stable per-flight
       identity to merge against. */
    if (upd.patch.flights) TRIP.flights = upd.patch.flights;
    if (upd.patch.days){
      Object.keys(upd.patch.days).forEach(function(dt){
        var day = (TRIP.days || []).filter(function(d){ return d.date === dt; })[0];
        if (day) Object.assign(day, upd.patch.days[dt]);
      });
    }
    /* Key dates, keyed by date like days. These are the headline moments a
       parent scans first, so an update that does not reach them leaves the
       summary contradicting the detail below it. */
    if (upd.patch.keyDates){
      Object.keys(upd.patch.keyDates).forEach(function(dt){
        var kd = (TRIP.keyDates || []).filter(function(k){ return k.date === dt; })[0];
        if (kd) Object.assign(kd, upd.patch.keyDates[dt]);
      });
    }
    /* Trek headline figures. A route change alters the total distance, and
       the completion state is `km >= totalKm` — leave the total alone and a
       shortened trek can never finish. */
    if (upd.patch.trek && TRIP.trek) Object.assign(TRIP.trek, upd.patch.trek);
  });

  window.__DEMO__ = { date: dateStr, offset: OFFSET, beat: beat, cfg: D,
                      updates: UPDATES, published: published, updated: published > 0 };
})();
</script>
<script>
/* ===========================================================================
   ENGINE — nothing below is specific to any one trip. Everything it renders
   comes from the TRIP object in the config file loaded above.
   =========================================================================== */

if (typeof TRIP === "undefined") {
  document.body.innerHTML = '<main style="padding:40px 20px;font-family:Inter,sans-serif">' +
    '<h1 style="font-family:Fraunces,serif">No trip config loaded</h1>' +
    '<p>Expected a <code>trip-config.js</code> alongside this file, defining <code>const TRIP</code>. ' +
    'Working from the repo? Name the trip: <code>index.html?trip=cambodia</code> loads ' +
    '<code>trips/cambodia/trip-config.js</code>. ' +
    'Generate one with <a href="setup.html">setup.html</a>.</p></main>';
  throw new Error("TRIP config missing");
}

/* Unmistakable marker when viewing an unpublished draft, so a preview is never
   mistaken for what everyone else can see. */
if (window.__PREVIEW__) {
  const b = document.createElement("div");
  b.style.cssText = "position:sticky;top:0;z-index:100;background:#8A6D3B;color:#fff;padding:7px 14px;"
    + "font:600 13px/1.4 Inter,sans-serif;text-align:center";
  b.textContent = "PREVIEW — unpublished draft, visible only to you. Publish from the Trip Builder to share it.";
  document.body.prepend(b);
}

/* A keepsake: the trip ended over 30 days ago, and this is the memory of it
   (scripts/make-keepsake.js). Said once, at the top, so nobody reads the
   itinerary as current or goes looking for the bookings that were taken out. */
if (TRIP.keepsake) {
  const b = document.createElement("div");
  b.style.cssText = "background:var(--surface);border-bottom:1px solid var(--border);padding:9px 16px;"
    + "font:500 calc(14px * var(--fs))/1.4 Inter,sans-serif;text-align:center;color:var(--text-muted)";
  b.textContent = "This trip has ended — kept here as a memory. Bookings, contacts and other details used during the trip have been taken out.";
  document.body.prepend(b);
}

/* --- iOS PWA staleness fix ------------------------------------------------
   iOS home-screen PWAs often resume a suspended page from memory rather than
   reloading, so the service worker's network-first fetch never re-runs and the
   app can show hours-old data. Force a real reload after a long background. */
(function(){
  let hiddenAt = null;
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") { hiddenAt = Date.now(); return; }
    if (document.visibilityState === "visible" && hiddenAt && (Date.now() - hiddenAt > 5*60*1000)) location.reload();
    hiddenAt = null;
  });
})();

/* --- Small helpers -------------------------------------------------------- */
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const $  = id => document.getElementById(id);
// A link the config gives as a relative path ("tickets/x.pdf") is a file in the
// trip's own folder, so resolve it there. Live that folder is the site root and
// this changes nothing; from the repo it is trips/<name>/.
const tripFile = u => (u && !/^([a-z][a-z0-9+.-]*:|\/|#)/i.test(u)) ? (window.TRIP_DIR || "") + u : u;
const storeKey = n => (TRIP.storagePrefix || "trip-") + n;

/* Carried over from the first version of the app (the one-file app on GitHub
   Pages, 2026). It kept a phone's messages, name and pronoun under other key
   names; a site that replaces it at the same address lists the old prefixes in
   `carryOver`, and the first time a phone opens it they are copied across, so
   nothing anyone wrote is lost. Once per phone; the old keys are left as they
   were. Old messages kept their date as an ISO string; it is shown the way
   this version writes it. */
(function(){
  const from = (TRIP.carryOver || []).filter(p => typeof p === "string" && p);
  if (!from.length) return;
  try {
    const DONE = storeKey("carried-over");
    if (localStorage.getItem(DONE)) return;
    const get = k => localStorage.getItem(k);
    const notes = (() => { try { return JSON.parse(get(storeKey("notes")) || "[]"); } catch(e){ return []; } })();
    const seen = new Set(notes.map(n => n && n.text)), carried = [];
    from.forEach(p => {
      if (!get(storeKey("traveller")) && get(p + "traveler-name")) localStorage.setItem(storeKey("traveller"), get(p + "traveler-name"));
      const pr = get(p + "traveler-pronoun");
      if (!get(storeKey("pronoun")) && /^(he|she|they)$/.test(pr || "")) localStorage.setItem(storeKey("pronoun"), pr);
      if (!get(storeKey("text-size")) && get(p + "text-size")) localStorage.setItem(storeKey("text-size"), get(p + "text-size"));
      let old = []; try { old = JSON.parse(get(p + "family-notes") || "[]"); } catch(e){}
      (Array.isArray(old) ? old : []).forEach(n => {
        if (!n || !n.text || seen.has(n.text)) return;
        seen.add(n.text);
        const d = new Date(n.date);
        carried.push({ text: n.text, date: isNaN(d) ? String(n.date || "") : d.toLocaleString("en-GB", { day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" }), at: isNaN(d) ? 0 : +d });
      });
    });
    // Newest first, as both versions list them, after anything already written here.
    carried.sort((a, b) => b.at - a.at);
    if (carried.length) localStorage.setItem(storeKey("notes"), JSON.stringify(notes.concat(carried.map(({ text, date }) => ({ text, date })))));
    localStorage.setItem(DONE, new Date().toISOString());
  } catch(e){}
})();

// Custom URL schemes for "Open {app}" buttons, tried before falling back to the
// https link — see openApp() below for why. Declared here (not near openApp/
// linkRow further down) because the "Tickets today" callout references it and
// runs earlier in the script; a `const` isn't hoisted the way a function
// declaration is, so it has to physically come first or every render before
// this point would throw.
const APP_SCHEMES = {
  axs: "axs://", ticketmaster: "ticketmaster://",
  airbnb: "airbnb://", expedia: "expedia://", hertz: "hertz://",
};

/* Which timezone should times be shown in? There's no single right answer, so
   it's the viewer's choice and it sticks:

     "there"  — local to the place the time refers to (the departure airport,
                the car hire desk). What an airline quotes. Right when you're
                the one travelling, or want to picture what they're doing.
     "here"   — the viewer's own device timezone. Right when you're at home
                working out when to set off for the airport to collect someone.

   Defaults to "there" because it matches how tickets and bookings are written.
   Every timestamp in the config carries its own UTC offset so both are possible
   from the same data. */
/* --- Text size ---------------------------------------------------------------
   Every reader-facing font size in the stylesheet is calc(Npx * var(--fs)), so
   this one variable scales the lot. A per-viewer choice kept on their own
   device, like the time display: a grandparent needing larger text should not
   change it for anyone else.

   Why not rely on browser zoom alone. Pinch-zoom is allowed (the viewport no
   longer blocks it), but zoom makes the page wider than the screen, so every
   line means scrolling sideways — fine for reading a phone number, miserable
   for a whole itinerary. This keeps text wrapping to the screen at any size.

   Applied here, before the first render, so the page never flashes small. */
const TEXT_SIZES = [
  { v: 1,    label: "Standard" },
  { v: 1.15, label: "Large" },
  { v: 1.3,  label: "Larger" },
  { v: 1.5,  label: "Largest" },
];
const TEXT_KEY = storeKey("text-size");
function applyTextSize(v){
  document.documentElement.style.setProperty("--fs", String(v));
  // For the few layouts that need to change shape, not just scale — side-by-side
  // columns sized in pixels stop fitting a phone well before the text does.
  document.documentElement.classList.toggle("ts-large", v >= 1.3);
}
(function(){
  let v = 1;
  try { v = parseFloat(localStorage.getItem(TEXT_KEY)) || 1; } catch(e){}
  // Only a size we still offer — a stored value from an older build could be
  // anything, and 3× text breaks every layout in the app.
  if (!TEXT_SIZES.some(t => t.v === v)) v = 1;
  applyTextSize(v);
})();

function initTextSizeControl(){
  const btn = document.getElementById("textSizeBtn");
  const panel = document.getElementById("textSizePanel");
  if (!btn || !panel) return;
  const current = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--fs")) || 1;
  const draw = () => {
    panel.innerHTML = `<h2>Text size</h2><div class="ts-opts">` +
      TEXT_SIZES.map(t => `<button type="button" data-fs="${t.v}" aria-pressed="${t.v === current()}"
        aria-label="${t.label}" style="font-size:${Math.round(15 * t.v)}px">A</button>`).join("") +
      `</div><p>Saved on this phone only. Pinch to zoom still works too.</p>`;
    panel.querySelectorAll("[data-fs]").forEach(b => b.addEventListener("click", () => {
      const v = parseFloat(b.dataset.fs);
      applyTextSize(v);
      try { localStorage.setItem(TEXT_KEY, String(v)); } catch(e){}
      // Update in place rather than redrawing. A redraw detached the tapped
      // button, so the tap-outside handler below saw a click on something no
      // longer inside the panel and closed it — nobody could step through the
      // sizes to compare them.
      panel.querySelectorAll("[data-fs]").forEach(o =>
        o.setAttribute("aria-pressed", String(parseFloat(o.dataset.fs) === v)));
      // The map measures its box once; text reflow can change the space around it.
      if (window.__tripMap && window.__tripMap.invalidateSize) window.__tripMap.invalidateSize();
    }));
  };
  const open = yes => {
    panel.hidden = !yes;
    btn.setAttribute("aria-expanded", String(yes));
    if (yes){ draw(); const on = panel.querySelector('[aria-pressed="true"]'); if (on) on.focus(); }
  };
  btn.addEventListener("click", () => open(panel.hidden));
  // Close on Escape (returning focus, so keyboard users are not stranded) and on
  // a tap anywhere else.
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !panel.hidden){ open(false); btn.focus(); }
  });
  document.addEventListener("click", e => {
    if (!panel.hidden && !panel.contains(e.target) && e.target !== btn) open(false);
  });
}

initTextSizeControl();

const TIME_KEY = storeKey("time-mode");
const timeMode = () => localStorage.getItem(TIME_KEY) === "here" ? "here" : "there";

function fmtAt(iso, opts){
  const s = String(iso), d = new Date(s);
  // "here" is just the default behaviour of toLocaleString — the browser's zone.
  if (timeMode() === "here") return d.toLocaleString("en-GB", opts);
  // 'Z' is an offset too — UTC. Treating it as "no offset" showed a Z time in
  // the viewer's own zone while the toggle said "their time".
  if (/Z$/i.test(s)) return d.toLocaleString("en-GB", Object.assign({ timeZone:"UTC" }, opts));
  const m = s.match(/([+-])(\d{2}):?(\d{2})$/);
  if (!m) return d.toLocaleString("en-GB", opts); // no offset at all — nothing to shift to
  const offMin = (m[1] === "-" ? -1 : 1) * (parseInt(m[2],10)*60 + parseInt(m[3],10));
  return new Date(d.getTime() + offMin*60000)
    .toLocaleString("en-GB", Object.assign({ timeZone:"UTC" }, opts));
}

// Short label for the viewer's own zone, e.g. "BST" — so the toggle says what
// "my time" actually means rather than leaving them to guess.
function viewerZoneLabel(){
  try {
    const p = new Intl.DateTimeFormat("en-GB",{ timeZoneName:"short" }).formatToParts(new Date());
    const z = p.find(x => x.type === "timeZoneName");
    return z ? z.value : "";
  } catch(e){ return ""; }
}

/* --- Name and pronoun tokens ---------------------------------------------
   Config text uses {name}, {subj}, {be} etc. so no trip file ever has to
   hardcode a name or assume a gender. Families can override the name and
   pronouns in-app; the stored values win over the config defaults. */
const PRONOUNS = {
  he:   { subj:"he",   Subj:"He",   obj:"him",  poss:"his",   Poss:"His",   be:"he's",    Be:"He's",    will:"he'll",   was:"was"  },
  she:  { subj:"she",  Subj:"She",  obj:"her",  poss:"her",   Poss:"Her",   be:"she's",   Be:"She's",   will:"she'll",  was:"was"  },
  they: { subj:"they", Subj:"They", obj:"them", poss:"their", Poss:"Their", be:"they're", Be:"They're", will:"they'll", was:"were" },
};
const NAME_STORED    = localStorage.getItem(storeKey("traveller"));
const PRONOUN_STORED = localStorage.getItem(storeKey("pronoun"));
const NAME      = (NAME_STORED || TRIP.trip.traveller || "the team").trim();
const PKEY      = PRONOUN_STORED || TRIP.trip.pronoun || "they";
const P         = PRONOUNS[PKEY] || PRONOUNS.they;
const IS_DEFAULT = !NAME_STORED;

function tok(s){
  if (s == null) return "";
  return String(s)
    .replace(/\{name\}/g, NAME)
    .replace(/\{trekArea\}/g, (TRIP.trek && TRIP.trek.areaLabel) || "")
    .replace(/\{(subj|Subj|obj|poss|Poss|be|Be|will|was)\}/g, (m, k) => P[k] != null ? P[k] : m);
}
// Tokenised *and* HTML-escaped, for anything a user could have typed.
const tokEsc = s => esc(tok(s));

/* --- Home-screen icon -------------------------------------------------------
   Auto-built, not authored: nobody has to source or design app art per trip.
   It's the trip's own gradient (primary -> primaryDeep, the same colours as
   the hero) with the destination's first letter in the accent colour — so a
   Cambodia trip and a Texas trip get visibly different icons on a phone's
   home screen for free, from data every config already has.

   `theme.iconLetter` overrides the auto-picked letter, if destination label or
   trip title don't give the right one to lead with (e.g. a trip titled
   "The Big One" wants a letter that isn't "T" for "The").
============================================================================= */
async function buildTripIcon(){
  const t = TRIP.theme || {};
  /* An explicit `iconLetter` is used exactly as given, so it can be a glyph as
     well as a letter. `iconArt` outranks it: a drawn motif is the nicer option
     and the reason this stopped being letters-only. */
  const set = String(t.iconLetter || "").trim();
  const source = TRIP.trip.destinationLabel || TRIP.trip.title || "?";
  const glyph = set || (source.trim().match(/[A-Za-z0-9]/) || ["?"])[0].toUpperCase();

  // Give the display font a moment to load so the letter isn't drawn in a generic
  // fallback face — but never block on it. Matters most on a first-ever visit,
  // before the font's been cached by the service worker.
  try {
    await Promise.race([ document.fonts.load('700 400px Fraunces'), new Promise(r => setTimeout(r, 1200)) ]);
  } catch(e){}

  const opts = { primary: t.primary, primaryDeep: t.primaryDeep, accent: t.accent,
                 art: t.iconArt, glyph };
  const draw = size => drawTripIcon(Object.assign({ size }, opts));
  // iOS home screen (180), two Android/PWA manifest sizes, and a browser-tab favicon.
  return { icon180: draw(180), icon192: draw(192), icon512: draw(512), favicon32: draw(32) };
}

/* --- Theme ----------------------------------------------------------------
   The config's palette becomes CSS custom properties, so the stylesheet above
   never names a colour. This is what makes a trip's own colour story possible
   without editing CSS. */
(async function(){
  const t = TRIP.theme || {};
  const map = {
    primary:"--primary", primaryDeep:"--primary-deep", accent:"--accent",
    background:"--bg", surface:"--surface", text:"--text", textBody:"--text-body",
    textMuted:"--text-muted", border:"--border", borderStrong:"--border-strong",
    past:"--past", success:"--success", warning:"--warning", alert:"--alert",
  };
  for (const k in map) if (t[k]) document.documentElement.style.setProperty(map[k], t[k]);

  const appName = IS_DEFAULT ? TRIP.trip.title : `${NAME}'s ${TRIP.trip.title}`;
  document.title = appName;
  const meta = document.createElement("meta");
  meta.name = "theme-color"; meta.content = t.primary || "#1B4332";
  document.head.appendChild(meta);

  const icons = await buildTripIcon();

  const apple = document.createElement("link");
  apple.rel = "apple-touch-icon"; apple.href = icons.icon180;
  document.head.appendChild(apple);

  const favicon = document.createElement("link");
  favicon.rel = "icon"; favicon.type = "image/png"; favicon.href = icons.favicon32;
  document.head.appendChild(favicon);

  // PWA manifest is built at runtime so it picks up this trip's name/colours/icons.
  const manifest = {
    name: appName, short_name: (TRIP.trip.title||"Trip").split(" ")[0],
    start_url: ".", display: "standalone",
    background_color: t.background || "#F6F1E7", theme_color: t.primary || "#1B4332",
    icons: [
      { src: icons.icon192, sizes:"192x192", type:"image/png" },
      { src: icons.icon512, sizes:"512x512", type:"image/png" },
    ],
  };
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = "data:application/json," + encodeURIComponent(JSON.stringify(manifest));
  document.head.appendChild(link);
})();

/* --- Trip-wide constants from config -------------------------------------- */
const DAYS   = TRIP.days || [];
const PHASES = TRIP.phases || {};
const TZ     = TRIP.trip.destinationTimeZone || "UTC";

/* --- Where are we in the trip? -------------------------------------------
   Day index is computed from the date in the DESTINATION's timezone, so the
   app rolls over to "day N" when it does there, not when it does here. */
/* Today's date on the trip's clock, as YYYY-MM-DD. Built from the zone's own
   date parts. The old way — toLocaleString in the zone, re-parsed, then
   toISOString() — read the destination's
   wall clock as if it were the viewer's, then converted to UTC, so "today" was
   out by the viewer's own offset: a relative in Chicago saw tomorrow from early
   evening, and a UK viewer saw yesterday for the first hour after midnight
   there. It moved the day number, the quiet-period banner and tickets-today. */
function destToday(){
  const p = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return `${p.year}-${p.month}-${p.day}`;
}
function dayIndexForToday(){
  if (!DAYS.length) return 0;
  const todayDest = destToday();
  const hit = DAYS.findIndex(d => d.date === todayDest);
  if (hit >= 0) return DAYS[hit].n;
  return todayDest < DAYS[0].date ? 0 : DAYS[DAYS.length-1].n + 1;
}
const currentDayNum = dayIndexForToday();
const status = currentDayNum < 1 ? "before" : (currentDayNum > DAYS.length ? "after" : "during");
const currentDay = DAYS.find(d => d.n === currentDayNum) || null;

/* --- Flights -------------------------------------------------------------- */
const FLIGHTS = TRIP.flights || [];

/* Live status comes from flight-status.json beside this page, written by the
   server's flight poller (scripts/flight-poller.js) — one set of calls for
   everybody, and no API key anywhere a phone can see. It used to be fetched
   from AeroDataBox by every phone, with the key in the config. Keyed by
   "<flight no>|<departure date>", so a flight number flown twice is two keys. */
let __live = {}, __liveMeta = null;
// On for every real trip unless its config turns it off; never for the demo's
// scripted story or a keepsake. The server's poller follows the same rule.
const LIVE_ON = !((TRIP.liveFlightStatus || {}).off || TRIP.keepsake || TRIP.sample || (TRIP.demo && TRIP.demo.enabled));
const liveKey = f => `${f.no}|${String(f.dep || "").slice(0, 10)}`;
const LIVE_STALE = 90 * 60e3;   // older than this, say when it was checked

function flightStatus(f, prevArr){
  const now = new Date(), arr = new Date(f.arr);
  const dep = f.dep ? new Date(f.dep) : (prevArr || null);
  const graceMs = (TRIP.flightGraceHours != null ? TRIP.flightGraceHours : 6) * 3600e3;
  const hm = t => fmtAt(t, { hour:"2-digit", minute:"2-digit" });
  const live = __live[liveKey(f)];

  /* What the airline's data says, when the server has it. Each label says it
     is confirmed, and when it was last checked if that was a while ago, so it
     is never mistaken for the clock-based guess below. */
  if (live && live.status && live.status !== "Unknown"){
    /* The server looks only when the answer can have changed — before
       departure, at the (new) departure time, at the estimated arrival — so a
       long silence is normal. Say when it will look next rather than how old
       the last look is; fall back to the age if it has none. */
    const inMin = live.nextCheck ? Math.round((new Date(live.nextCheck) - now) / 6e4) : null;
    const age = now - new Date(live.checkedAt);
    const when = inMin != null && inMin > 0
      ? ` · next check in ${inMin >= 60 ? Math.floor(inMin / 60) + "h" + (inMin % 60 ? " " + (inMin % 60) + "m" : "") : inMin + " min"}`
      : age > LIVE_STALE ? ` · checked ${Math.round(age / 36e5 * 10) / 10}h ago` : "";
    const arrT = live.arrRevised || live.arrScheduled || f.arr;
    const depT = live.depRevised || live.depScheduled || f.dep;
    switch (live.status){
      case "Arrived":
        return { label:`Landed ✅ ${hm(arrT)} (confirmed)`, cls: now >= new Date(new Date(arrT).getTime() + graceMs) ? "done" : "landed" };
      case "Canceled": case "CanceledUncertain":
        return { label:`Cancelled ❌ — check with the organiser${when}`, cls:"live alert" };
      case "Diverted":
        return { label:`Diverted ⚠️ — check with the organiser${when}`, cls:"live alert" };
      case "Departed": case "EnRoute": case "Approaching":
        // Past its estimated arrival and not yet confirmed down: say that,
        // rather than "in the air" from a look taken hours ago.
        if (now >= new Date(arrT)) return { label:`Due to have landed at ${hm(arrT)} — confirming${when}`, cls:"live" };
        return { label:`In the air ✈️ (confirmed) — due ${hm(arrT)}${live.arrDelayMin >= 10 ? `, ${live.arrDelayMin}m late` : ""}${when}`, cls:"live" };
      default: {
        const late = live.depDelayMin >= 10;
        const txt = late ? `Delayed ${Math.floor(live.depDelayMin/60) ? Math.floor(live.depDelayMin/60)+"h " : ""}${live.depDelayMin%60}m — now departing ${hm(depT)}`
                         : `On time (${live.status === "Expected" ? "expected" : live.status.replace(/([a-z])([A-Z])/g, "$1 $2").toLowerCase()})`;
        return { label: txt + when, cls: dep && now >= dep ? "live" : "" };
      }
    }
  }

  /* No live answer: the clock against the schedule, and it says so. It used to
     read "In the air ✈️" and then "Landed ✅" — statements of fact the app had
     no way to make. The grace period only decides when a leg leaves the list. */
  const at = hm(f.arr);
  if (now >= new Date(arr.getTime() + graceMs)) return { label:`Due to have landed at ${at} — not confirmed`, cls:"done" };
  if (now >= arr) return { label:`Due to have landed at ${at} — not confirmed. Tap Track live to check.`, cls:"live" };
  if (dep && now >= dep) return { label:"Due to be in the air — not confirmed", cls:"live" };
  if (!f.dep && prevArr && now >= prevArr) return { label:"Due to be in transit — not confirmed", cls:"live" };
  return { label:"Scheduled", cls:"" };
}

/* Fetch the server's file. `onChange` redraws the flights when it brings
   something new. Quietly does nothing when the trip has live status off, in the
   Builder's preview (there is no file), or offline with nothing saved. */
let __liveLastFetch = 0, __liveOnChange = null;
async function updateLiveFlights(force){
  if (!LIVE_ON || window.__PREVIEW__) return;
  if (!force && Date.now() - __liveLastFetch < 60e3) return;
  __liveLastFetch = Date.now();
  try {
    const r = await fetch(window.TRIP_DIR + "flight-status.json", { cache: "no-store" });
    if (!r.ok) return;
    const j = await r.json();
    if (__liveMeta && __liveMeta.generated === j.generated) return;
    __live = j.flights || {};
    __liveMeta = { generated: j.generated, capReached: !!j.capReached };
    if (__liveOnChange) __liveOnChange();
  } catch(e){}
}

/* --- Header, progress, countdown ------------------------------------------ */
$("eyebrow").textContent   = tok(TRIP.trip.eyebrow || "");
$("pageTitle").textContent = IS_DEFAULT ? TRIP.trip.title : `${NAME}'s ${TRIP.trip.title}`;
$("subtitle").textContent  = tok(TRIP.trip.subtitle || "");
$("footer").textContent    = tok(TRIP.trip.footer || "");

/* When was this itinerary last confirmed?
   Updates are a republish, so the app can be confidently out of date — during
   the Dubai delay families were reading something authoritative-looking that was
   two days stale. Showing the date lets people judge for themselves, and after a
   mid-trip update it's the visible proof the change actually went out. */
(function(){
  const u = TRIP.trip.updated;
  if (!u) return;
  const days = Math.floor((Date.now() - new Date(u + "T12:00:00Z")) / 864e5);
  const when = new Date(u + "T12:00:00Z").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric",timeZone:"UTC"});
  const el = document.createElement("div");
  el.className = "updated-note" + (days > 7 && status === "during" ? " stale" : "");
  el.textContent = days > 7 && status === "during"
    ? `Itinerary last updated ${when} (${days} days ago) — check with the organiser if plans have changed since.`
    : `Itinerary last updated ${when}.`;
  $("footer").parentNode.insertBefore(el, $("footer"));
})();

(function(){
  const total = DAYS.length;
  const label = $("progressLabel"), fill = $("progressFill");
  if (status === "before"){
    // "Mon 12 Jul 2027", not "2027-07-12". The ISO form splits at its hyphens
    // once text is enlarged — "2027-07-" on one line, "12" on the next — and a
    // screen reader reads it out as a subtraction. Non-breaking spaces keep the
    // date whole on narrow screens at any text size.
    const d0 = DAYS.length ? DAYS[0].date : "";
    const human = d0 ? new Date(d0 + "T12:00:00Z").toLocaleDateString("en-GB",
      { weekday:"short", day:"numeric", month:"short", year:"numeric", timeZone:"UTC" }).replace(/ /g, " ") : "";
    label.textContent = `Trip starts ${human}`;
    fill.style.width = "0%";
  }
  else if (status === "after"){ label.textContent = `Trip complete — all ${total} days`; fill.style.width = "100%"; }
  else { label.textContent = `Day ${currentDayNum} of ${total}`; fill.style.width = Math.round(currentDayNum/total*100) + "%"; }
})();

function renderCountdown(){
  const row = $("countdownRow");
  const dep = new Date(TRIP.trip.departureMoment);
  // The scheduled landing home where there is one, otherwise the end of the
  // last day. Either way it is the schedule, so the label afterwards says the
  // trip is over — it used to say "home safe", which the app cannot know.
  const lastArr = FLIGHTS.length && FLIGHTS[FLIGHTS.length-1].arr;
  const end = lastArr ? new Date(lastArr)
            : DAYS.length ? new Date(DAYS[DAYS.length-1].date + "T23:59:59Z") : null;
  const now = new Date();
  const fmt = ms => {
    const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5);
    return d > 0 ? `${d}d ${h}h` : `${h}h ${Math.floor(ms%36e5/6e4)}m`;
  };
  let html = "";
  if (now < dep) html = `<div class="countdown-box"><div class="countdown-num">${fmt(dep-now)}</div><div class="countdown-lbl">until departure ✈️</div></div>`;
  else if (end && now < end) html =
    `<div class="countdown-box"><div class="countdown-num">${currentDayNum}</div><div class="countdown-lbl">day of the trip</div></div>` +
    `<div class="countdown-box"><div class="countdown-num">${fmt(end-now)}</div><div class="countdown-lbl">until due home 🏡</div></div>`;
  else html = `<div class="countdown-box"><div class="countdown-num">🏁</div><div class="countdown-lbl">trip over</div></div>`;
  row.innerHTML = html;
}
renderCountdown();

/* --- "Over there right now" ----------------------------------------------- */
function schedLine(day){
  if (!day || !day.schedule || !day.schedule.length) return "";
  const h = parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",hour12:false}).format(new Date()),10);
  let act = day.schedule[0][1];
  for (const [start, a] of day.schedule) if (h >= start) act = a;
  return `<div class="right-now">🧭 <b>Right now ${P.be} probably:</b> ${tokEsc(act)}</div>`;
}

/* Where the traveller actually is today, which is not always the trip's
   destination — a missed connection can strand them somewhere else for a day.

   The weather already followed the day's coordinates. The clock and the label
   did not, so during the Dubai delay this panel read "39°C in Phnom Penh":
   the temperature was Dubai's, the place name was the itinerary's, and each
   half was right on its own.

   Opt-in per day. A day with no `tz` uses the trip's destination, so no
   existing trip changes behaviour by adding this. The label falls out of the
   zone name ("Asia/Dubai" → "Dubai") unless the day sets `tzLabel`.

   Deliberately NOT used for the day index — see dayIndexForToday(). The
   itinerary is planned in the destination's terms and should roll over when
   the date does there, wherever the team happen to have been diverted to. */
function whereTheyAreNow(){
  const d = currentDay || {};
  if (!d.tz) return { tz: TZ, label: TRIP.trip.destinationLabel || "" };
  return { tz: d.tz, label: d.tzLabel || d.tz.split("/").pop().replace(/_/g, " ") };
}

function renderThereNow(){
  const el = $("thereNow");
  if (status !== "during"){ el.style.display = "none"; return; }
  el.style.display = "";
  const here = whereTheyAreNow();
  const time = new Intl.DateTimeFormat("en-GB",{timeZone:here.tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());
  const h = parseInt(time,10);
  const part = h<5?"the middle of the night":h<12?"morning there":h<17?"afternoon there":h<21?"evening there":`${P.be} probably winding down`;
  el.innerHTML = `<div class="tn-head">Over there right now</div>🕐 ${time} in ${esc(here.label)} — ${part}` +
                 `<div id="weatherLine" style="margin-top:4px;opacity:.9"></div>`;
  loadWeather();
}
renderThereNow();
setInterval(renderThereNow, 30000);

// Open-Meteo needs no key and no account. Fails silently — it's a nice-to-have.
async function loadWeather(){
  if (!currentDay || currentDay.lat == null) return;
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${currentDay.lat}&longitude=${currentDay.lng}&current=temperature_2m,relative_humidity_2m,weather_code`);
    if (!r.ok) return;
    const j = await r.json(), c = j.current;
    if (!c) return;
    const codes = {0:"clear ☀️",1:"mostly clear 🌤",2:"partly cloudy ⛅",3:"overcast ☁️",45:"foggy 🌫",48:"foggy 🌫",
      51:"light drizzle 🌦",53:"drizzle 🌦",55:"drizzle 🌦",61:"light rain 🌧",63:"rain 🌧",65:"heavy rain 🌧",
      80:"showers 🌦",81:"showers 🌦",82:"heavy showers ⛈",95:"thunderstorms ⛈",96:"thunderstorms ⛈",99:"thunderstorms ⛈"};
    const w = $("weatherLine");
    if (w) w.innerHTML = `🌡 ${Math.round(c.temperature_2m)}°C and ${codes[c.weather_code]||"—"} · 💧 ${c.relative_humidity_2m}% humidity`;
  } catch(e){}
}

/* --- Quiet periods --------------------------------------------------------
   The single most anxious stretch of a trip is the one where contact stops —
   the trek, a long flight, anywhere without signal. Left alone the app just
   carries on cheerfully, which reads as "nothing is happening" rather than
   "nothing is *expected* to happen". Saying so plainly, and saying when news is
   next likely, is the thing a WhatsApp group can never do.

   Config: noContact: [{ from, to, reason, nextNews }] — omit and nothing shows. */
(function(){
  const windows = TRIP.noContact;
  if (!Array.isArray(windows) || !windows.length) return;
  const todayDest = destToday();

  const active  = windows.find(w => todayDest >= w.from && todayDest <= w.to);
  // Only flag one that's imminent, not one three weeks out.
  const soon    = windows.find(w => {
    if (todayDest >= w.from) return false;
    const days = (new Date(w.from) - new Date(todayDest)) / 864e5;
    return days > 0 && days <= 2;
  });
  const w = active || soon;
  if (!w) return;

  const el = document.createElement("div");
  el.className = "quiet";
  el.innerHTML = active
    ? `<div class="quiet-head">📵 Quiet period — this is expected</div>
       ${tokEsc(w.reason || "No contact expected right now.")}
       ${w.nextNews ? `<div class="quiet-next">Next news expected: <b>${tokEsc(w.nextNews)}</b></div>` : ""}`
    : `<div class="quiet-head">📵 Quiet period coming up</div>
       From ${new Date(w.from+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short",timeZone:"UTC"})} —
       ${tokEsc(w.reason || "no contact expected.")}
       ${w.nextNews ? `<div class="quiet-next">News expected again: <b>${tokEsc(w.nextNews)}</b></div>` : ""}`;
  // Directly under the countdown, above the key dates — the first thing read.
  $("keyDates").parentNode.insertBefore(el, $("keyDates"));
})();

/* --- Tickets today ---------------------------------------------------------
   A `bookings` entry with a `when` date gets a prominent callout on that exact
   day, so an event ticket doesn't sit buried in a long Info-tab list on the
   one day it actually matters. The `appLink` deliberately points at the
   ticketing app/site's general sign-in page, not the personalised
   "view ticket" link from a confirmation email — those are tied to the
   purchaser's account, may not open for someone else in the family, and can
   expire before the trip. Same reuse of the quiet-period box style: both are
   "read this first, right now" notices. */
(function(){
  const list = TRIP.bookings;
  if (!Array.isArray(list) || !list.length) return;
  const todayDest = destToday();
  const today = list.filter(b => b.when === todayDest);
  if (!today.length) return;

  const el = document.createElement("div");
  el.className = "quiet";
  el.innerHTML = today.map(b => `
    <div class="quiet-head">🎟 Today${b.time ? ` · ${tokEsc(b.time)}` : ""}</div>
    <div style="font-family:'Fraunces',serif;font-size:calc(18px * var(--fs));margin:2px 0">${tokEsc(b.what)}</div>
    ${b.beThereBy ? `<div style="font-weight:600;margin:4px 0">⏰ ${tokEsc(b.beThereBy)}</div>` : ""}
    ${b.satNav ? `<div style="margin:6px 0"><a href="${esc(b.satNav)}" target="_blank" rel="noreferrer"
        style="font-weight:600;color:var(--primary)">🧭 Directions ↗</a></div>` : ""}
    ${b.note ? `${tokEsc(b.note)}` : ""}
    ${b.appLink ? `<div style="margin-top:8px"><a href="${esc(tripFile(b.appLink))}" target="_blank" rel="noreferrer"
        ${b.appName && APP_SCHEMES[b.appName.toLowerCase()] ? `onclick="openApp(event, '${esc(APP_SCHEMES[b.appName.toLowerCase()])}')"` : ""}
        style="display:inline-block;background:var(--accent);color:var(--primary-deep);font-weight:600;
               text-decoration:none;border-radius:8px;padding:8px 14px;font-size:calc(14px * var(--fs))">
        Open ${esc(b.appName || "tickets")} ↗</a></div>` : ""}
  `).join("");
  $("keyDates").parentNode.insertBefore(el, $("keyDates"));
})();

/* --- The trip as events: calendar and "Next up" ------------------------------
   The events themselves come from trip-calendar.js, shared with the server
   (which writes the calendar an iPhone subscribes to), so the two cannot
   differ. What is here is the page's side: the buttons, and the Next up card.

   - iPhones and Macs subscribe to the calendar the server publishes with the
     trip (calendar.json says where): one tap, and it keeps itself up to date.
     A calendar file made on the phone does nothing on an iPhone.
   - Android and Windows download a file made here, which their calendars open.
   - "Next up" (trips read by the people travelling) shows what is on now or next. */
const CAL = TripCalendar(TRIP, { tok, includeRefs: true });
const CAL_AT_HOME = CAL.atHome;
const tripEvents = CAL.events;
const APPLE = /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent);
let CAL_SUB = null;   // the published calendar's address, once calendar.json is read
fetch(window.TRIP_DIR + "calendar.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : null)
  .then(j => { if (j && j.path) { CAL_SUB = j.path; document.dispatchEvent(new Event("calendar-ready")); } })
  .catch(() => {});

/* The download, for Android and computers: a file their calendar opens. */
function addToCalendar(events, name){
  if (!events.length) return;
  const text = CAL.ics(events);
  const url = URL.createObjectURL(new Blob([text], { type: "text/calendar;charset=utf-8" }));
  const a = document.createElement("a");
  a.href = url; a.download = (name || "trip").replace(/[^\w-]+/g, "-").replace(/^-+|-+$/g, "") + ".ics";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
}

// One button, anywhere: data-cal="all" for the whole trip, or an event's key.
// Not on iPhones and Macs, where a file made on the phone does nothing: they
// use the subscription on the Info tab instead.
const calButton = (key, label) => !key || (APPLE && key !== "all") ? "" :
  `<button type="button" class="cal-add" data-cal="${esc(key)}">📅 ${esc(label || "Add to calendar")}</button>`;
// The event made from a given flight or booking, for its own button.
const eventKeyFor = (kind, src) => { const e = tripEvents().find(x => x.kind === kind && x.src === src); return e ? e.key : ""; };
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest("[data-cal]");
  if (!b) return;
  const all = tripEvents();
  const key = b.dataset.cal;
  const pick = key === "all" ? all : all.filter(e => e.key === key);
  addToCalendar(pick, key === "all" ? CAL.plain(TRIP.trip.title) : (pick[0] ? pick[0].title : "event"));
});

function calendarCard(){
  if (!tripEvents().length || TRIP.keepsake) return "";
  const what = CAL_AT_HOME
    ? "The flights, key moments and quiet periods, in your own calendar — shown in your own time."
    : "Every flight, booking, stay and the car, with a reminder before each one. Times are right wherever the phone is.";
  // On an iPhone or Mac: subscribe, once the server's calendar is known. The
  // card is redrawn when calendar.json arrives (see "calendar-ready").
  const action = APPLE
    ? (CAL_SUB
        ? `<a class="cal-add" href="webcal://${esc(location.host)}${esc(location.pathname.replace(/[^/]*$/, ""))}${esc(window.TRIP_DIR + CAL_SUB)}">📅 Subscribe in Calendar</a>
           <p class="placeholder" style="font-size:calc(12px * var(--fs));margin:10px 0 0">Tap <b>Subscribe</b>, then <b>Add</b>. Your calendar then keeps itself up to date — when the trip changes, it changes too, within a few hours.</p>
           <p class="placeholder" style="font-size:calc(12px * var(--fs));margin:6px 0 0"><b>To remove it after the trip:</b> in Calendar, tap <b>Calendars</b> at the bottom, tap the <b>ⓘ</b> beside ${esc(CAL.plain(TRIP.trip.title))}, then <b>Delete Calendar</b>.</p>`
        : `<p class="placeholder" style="margin:0">Open this app with signal to add the trip to your calendar.</p>`)
    : `${calButton("all", "Add the whole trip")}
       <p class="placeholder" style="font-size:calc(12px * var(--fs));margin:10px 0 0">If plans change, add it again — most calendars update these events rather than doubling them.</p>`;
  return `<div class="info-card"><h4>📅 Add to your calendar</h4>
    <p class="placeholder" style="margin-bottom:10px">${what}</p>${action}</div>`;
}

/* --- Next up ---------------------------------------------------------------
   For the people travelling: the one thing that is on now, or next, with what
   they need for it. The itinerary says what the day is; this says what to do
   in the next few hours — the part of a friends' trip app that is "where do we
   need to be, and when". */
(function(){
  if (CAL_AT_HOME) return;
  const host = document.createElement("div");
  $("currentCard").parentNode.insertBefore(host, $("currentCard"));
  const within = 36 * 36e5;

  // Times read as the rest of the app does: local to the place ("their
  // time") or the viewer's own, per the toggle on the Info tab.
  const hm = { hour:"2-digit", minute:"2-digit" };
  const clock = (e, which) => {
    const iso = e.kind === "flight" ? (which === "start" ? e.src.dep : e.src.arr)
              : e.kind === "car" && which === "start" ? e.src.when : null;
    if (iso) return fmtAt(iso, hm);
    const d = which === "start" ? e.start : e.end;
    return timeMode() === "here" ? d.toLocaleTimeString("en-GB", hm)
                                 : d.toLocaleTimeString("en-GB", Object.assign({ timeZone: e.tz || TZ }, hm));
  };
  const when = e => {
    const mins = Math.round((e.start - new Date()) / 6e4);
    if (mins <= 0) return `Now · until ${clock(e, "end")}`;
    const rel = mins < 60 ? `in ${mins} min` : `in ${Math.floor(mins / 60)}h ${mins % 60}m`;
    const day = destTodayOf(e.start) === destToday() ? "Today" : "Tomorrow";
    return `${day} ${clock(e, "start")} · ${rel}`;
  };

  function draw(){
    const now = new Date();
    const timed = tripEvents().filter(e => e.start && e.kind !== "stay" && e.end > now && e.start - now < within);
    // An untimed booking for today still belongs here, after anything timed.
    const allDay = tripEvents().filter(e => e.kind === "booking" && !e.start && e.date === destToday());
    const e = timed[0] || allDay[0];
    if (!e){ host.innerHTML = ""; return; }
    const s = e.src || {};
    const on = e.start && e.start <= now;
    host.innerHTML = `<div class="next-up">
      <div class="quiet-head">${on ? "Happening now" : "Next up"}</div>
      <div class="next-title">${esc(e.title)}</div>
      <div class="next-when">${e.start ? esc(when(e)) : `Today${s.time ? " · " + esc(s.time) : ""}`}</div>
      ${s.beThereBy ? `<div style="font-weight:600;margin:4px 0">⏰ ${tokEsc(s.beThereBy)}</div>` : ""}
      ${e.location ? `<div class="next-where">${esc(e.location)}</div>` : ""}
      <div class="next-actions">
        ${s.satNav ? `<a class="next-btn" href="${esc(s.satNav)}" target="_blank" rel="noreferrer">🧭 Directions</a>` : ""}
        ${s.appLink ? `<a class="next-btn" href="${esc(tripFile(s.appLink))}" target="_blank" rel="noreferrer">🎟 Open ${esc(s.appName || "tickets")}</a>` : ""}
        ${e.kind === "flight" ? `<a class="next-btn" href="https://www.flightradar24.com/data/flights/${esc(String(s.no || "").replace(/[^A-Za-z0-9]/g, "").toLowerCase())}" target="_blank" rel="noreferrer">✈ Track live</a>` : ""}
        ${calButton(e.key)}
      </div></div>`;
  }
  draw();
  setInterval(draw, 60e3);
})();

// The destination-zone date an instant falls on.
function destTodayOf(d){
  const p = {};
  new Intl.DateTimeFormat("en-GB", { timeZone: TZ, year:"numeric", month:"2-digit", day:"2-digit" }).formatToParts(d).forEach(x => { p[x.type] = x.value; });
  return `${p.year}-${p.month}-${p.day}`;
}

/* --- Key dates ------------------------------------------------------------ */
(function(){
  const el = $("keyDates"), list = TRIP.keyDates || [];
  if (!list.length){ el.style.display = "none"; return; }
  // Compare in the destination's timezone so an entry doesn't strike through
  // early or late relative to where the trip actually is.
  const todayDest = destToday();
  el.innerHTML = `<div class="tn-head" style="font-family:'JetBrains Mono',monospace;font-size:calc(14px * var(--fs));letter-spacing:1px;text-transform:uppercase;color:var(--accent)">Key moments</div>` +
    list.map(k => `<div class="key-date ${todayDest>k.date?'done':''}"><span class="kd-when">${esc(k.when)}</span><span class="kd-label">${tokEsc(k.label)}</span></div>`).join("");
})();

/* --- Today's card --------------------------------------------------------- */
(function(){
  if (!currentDay || status !== "during") return;
  const p = PHASES[currentDay.phase] || { label:currentDay.phase, colour:"#666", icon:"" };
  const photo = currentDay.photo && TRIP.photos ? TRIP.photos[currentDay.photo] : null;
  $("currentCard").innerHTML = `
    <div class="current-card">
      ${photo ? `<img src="${esc(photo)}" alt="${tokEsc(currentDay.loc)}">` : ""}
      <div class="inner">
        <span class="phase-pill" style="background:${esc(p.colour)}">${esc(p.icon)} ${esc(p.label)}</span>
        <h2 class="current-loc">${tokEsc(currentDay.loc)}</h2>
        ${schedLine(currentDay)}
        <p style="font-size:calc(17px * var(--fs));line-height:1.5;margin:0;color:var(--text-body)">${tokEsc(currentDay.summary)}</p>
        ${currentDay.fact ? `<div class="fun-fact"><b>Today's fact:</b> ${tokEsc(currentDay.fact)}</div>` : ""}
      </div>
    </div>`;
})();

/* --- Why these colours ---------------------------------------------------- */
(function(){
  const el = $("themeStory"), t = TRIP.theme || {};
  if (!t.story){ el.style.display = "none"; return; }
  // story may contain deliberate markup (<i>…</i>) written by the trip author,
  // so it's tokenised but not escaped — it's config, not user input.
  el.innerHTML = `<h4>🎨 Why these colours?</h4><p class="placeholder">${tok(t.story)}</p>`;
})();

/* --- Itinerary ------------------------------------------------------------ */
(function(){
  const el = $("timeline");
  if (!DAYS.length){ el.innerHTML = "<p>No days configured.</p>"; return; }
  const pastCount = Math.max(0, Math.min(currentDayNum-1, DAYS.length));
  const render = (showPast) => {
    const shown = showPast ? DAYS : DAYS.filter(d => d.n >= currentDayNum);
    el.innerHTML =
      (!showPast && pastCount > 0 ? `<button class="past-days-toggle" id="showPast">▸ Show ${pastCount} earlier day${pastCount>1?"s":""} (already happened)</button>` : "") +
      shown.map(d => {
        const p = PHASES[d.phase] || { label:d.phase, colour:"#666", text:"#666", icon:"" };
        const isToday = d.n === currentDayNum, isPast = d.n < currentDayNum;
        const photo = d.photo && TRIP.photos ? TRIP.photos[d.photo] : null;
        const mapUrl = d.map && TRIP.maps ? TRIP.maps[d.map] : null;
        const dt = new Date(d.date + "T12:00:00Z");
        return `<div class="day-row">
          <div class="dot ${isToday?'today':isPast?'past':''}" tabindex="0" role="button" aria-expanded="${TRIP.keepsake?'true':'false'}" data-day="${d.n}">${d.n}</div>
          <div class="day-card ${isToday?'today':''}" data-day="${d.n}" tabindex="0">
            <div class="day-head">
              <span class="day-date">${dt.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})}</span>
              <span class="phase-tag" style="color:${esc(p.text||p.colour)}">${esc(p.icon)} ${esc(p.label)}</span>
            </div>
            <div class="day-loc">${tokEsc(d.loc)}</div>
            <div class="day-body${TRIP.keepsake ? " open" : ""}" id="body-${d.n}">
              ${photo ? `<img class="day-photo" src="${esc(photo)}" alt="${tokEsc(d.loc)}" loading="lazy">` : ""}
              <p class="day-summary">${tokEsc(d.summary)}</p>
              ${d.fact ? `<p class="day-summary" style="font-size:calc(15px * var(--fs))"><b>Fun fact:</b> ${tokEsc(d.fact)}</p>` : ""}
              ${mapUrl ? `<a href="${esc(mapUrl)}" target="_blank" rel="noreferrer">View on Google Maps ↗</a>` : ""}
            </div>
          </div>
        </div>`;
      }).join("");
    const sp = $("showPast");
    if (sp) sp.addEventListener("click", () => render(true));
    el.querySelectorAll("[data-day]").forEach(node => {
      const toggle = () => {
        const b = $("body-" + node.dataset.day);
        if (!b) return;
        b.classList.toggle("open");
        const dot = el.querySelector(`.dot[data-day="${node.dataset.day}"]`);
        if (dot) dot.setAttribute("aria-expanded", b.classList.contains("open") ? "true" : "false");
      };
