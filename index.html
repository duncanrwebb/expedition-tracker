      node.addEventListener("click", toggle);
      node.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ e.preventDefault(); toggle(); } });
    });
  };
  render(status !== "during");
})();

/* --- Map ------------------------------------------------------------------ */
let map = null, routeBounds = null;
(function(){
  // `onMap:false` keeps a day off the route map while leaving it in the itinerary.
  // Mainly for the days at either end that are really just getting there and back:
  // a home airport 8,000km away stretches the map across two continents and squashes
  // the part anyone actually wants to look at down to a few pixels.
  const pts = DAYS.filter(d => d.lat != null && d.lng != null && d.onMap !== false);
  if (!pts.length || typeof L === "undefined"){ $("map").style.display = "none"; return; }

  map = L.map("map", { scrollWheelZoom:false });
  window.__tripMap = map;   // so a text-size change can ask it to re-measure
  L.Popup.mergeOptions({ closeButton:false });
  const streetLayer = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
    { attribution:"&copy; Esri, OpenStreetMap contributors", maxZoom:18 }).addTo(map);
  // "Hybrid" — satellite imagery plus a labels overlay (place names, roads, borders),
  // grouped so the toggle adds/removes both together. Plain satellite imagery on its
  // own is hard to read anywhere without an obvious landmark.
  const hybridLayer = L.layerGroup([
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { attribution:"&copy; Esri, Maxar, Earthstar Geographics", maxZoom:18 }),
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      { attribution:"&copy; Esri", maxZoom:18 }),
  ]);

  // Map / Hybrid toggle, styled to match the app's own theme (not a Leaflet anchor
  // control, so it can't be caught by viewers that intercept in-page hash links)
  const mapTypeControl = L.control({ position:"topright" });
  mapTypeControl.onAdd = function(){
    const div = L.DomUtil.create("div");
    L.DomEvent.disableClickPropagation(div);
    div.style.cssText = "display:flex;background:#fff;border-radius:20px;box-shadow:0 2px 8px rgba(0,0,0,.2);overflow:hidden;font-family:Inter,sans-serif;font-size:calc(13px * var(--fs));font-weight:600;";
    div.innerHTML = `
      <button type="button" id="mapTypeStreet" style="border:none;padding:8px 14px;cursor:pointer;">Map</button>
      <button type="button" id="mapTypeSat" style="border:none;padding:8px 14px;cursor:pointer;">Hybrid</button>`;
    return div;
  };
  mapTypeControl.addTo(map);
  map.whenReady(()=>{
    const streetBtn = document.getElementById("mapTypeStreet");
    const satBtn = document.getElementById("mapTypeSat");
    const onStyle = "border:none;padding:8px 14px;cursor:pointer;background:var(--primary);color:#fff;";
    const offStyle = "border:none;padding:8px 14px;cursor:pointer;background:#fff;color:var(--text);";
    function setActive(which){
      streetBtn.style.cssText = which==="street" ? onStyle : offStyle;
      satBtn.style.cssText = which==="sat" ? onStyle : offStyle;
      streetBtn.setAttribute("aria-pressed", which==="street");
      satBtn.setAttribute("aria-pressed", which==="sat");
    }
    streetBtn.addEventListener("click", ()=>{ map.removeLayer(hybridLayer); map.addLayer(streetLayer); setActive("street"); });
    satBtn.addEventListener("click", ()=>{ map.removeLayer(streetLayer); map.addLayer(hybridLayer); setActive("sat"); });
    setActive("street");
  });
  map.__street = streetLayer;

  const layers = {};
  Object.keys(PHASES).forEach(k => layers[k] = L.layerGroup().addTo(map));

  // Draw legs coloured by the phase of the day being travelled *to*.
  for (let i=1; i<pts.length; i++){
    const a = pts[i-1], b = pts[i];
    if (a.lat===b.lat && a.lng===b.lng) continue;
    const ph = PHASES[b.phase] || { colour:"#666" };
    const grp = layers[b.phase] || map;
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:"#fff", weight:6, opacity:.7 }).addTo(grp);
    L.polyline([[a.lat,a.lng],[b.lat,b.lng]], { color:ph.colour, weight:3, opacity:.95 }).addTo(grp);
  }

  // A location visited more than once would stack markers exactly on top of
  // each other, hiding the earlier ones — nudge repeats onto a small spiral.
  const seen = {};
  pts.forEach(d => {
    const key = d.lat.toFixed(4)+","+d.lng.toFixed(4);
    const nth = seen[key] = (seen[key]||0) + 1;
    let lat = d.lat, lng = d.lng;
    if (nth > 1){
      const ang = (nth-1) * 2.4, r = 0.035 * (1 + (nth-1)*0.35);
      lat += r*Math.cos(ang); lng += r*Math.sin(ang);
    }
    const ph = PHASES[d.phase] || { colour:"#666", label:d.phase };
    const isNow = d.n === currentDayNum;
    const icon = L.divIcon({ className:"", iconSize:[26,26], iconAnchor:[13,13],
      html:`<div style="width:26px;height:26px;border-radius:50%;background:${esc(ph.colour)};color:#fff;
             border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font:600 12px/22px 'JetBrains Mono',monospace;
             text-align:center;${isNow?"outline:3px solid var(--accent);":""}">${d.n}</div>` });
    L.marker([lat,lng], { icon, zIndexOffset: isNow?1000:0 })
      .addTo(layers[d.phase] || map)
      .bindPopup(`<b>Day ${d.n}: ${tokEsc(d.loc)}</b><br>${tokEsc(d.summary).slice(0,140)}…`);
  });

  routeBounds = L.latLngBounds(pts.map(d => [d.lat, d.lng])).pad(0.15);
  map.fitBounds(routeBounds);

  // Phase filter chips
  $("mapControls").innerHTML =
    `<p class="hint">Tap a phase to show or hide it on the map.</p><div class="chip-row">` +
    Object.entries(PHASES).map(([k,p]) =>
      `<label class="chip" data-phase="${esc(k)}"><input type="checkbox" checked>
        <span style="width:12px;height:12px;border-radius:50%;background:${esc(p.colour)};display:inline-block"></span>
        ${esc(p.icon)} ${esc(p.label)}</label>`).join("") + `</div>`;
  $("mapControls").querySelectorAll(".chip").forEach(chip => {
    const cb = chip.querySelector("input"), k = chip.dataset.phase;
    cb.addEventListener("change", () => {
      if (cb.checked){ map.addLayer(layers[k]); chip.classList.remove("off"); }
      else { map.removeLayer(layers[k]); chip.classList.add("off"); }
    });
  });

  /* The trip's own photos, where they were taken — like Google Photos' map.
     Only photos whose position survived make-gallery.js have one (it keeps
     positions for a private trip only). Photos close together on screen are
     one pin with a count, regrouped as you zoom; tapping a pin opens the first
     of them in the photo viewer, from where the rest are a swipe away. */
  document.addEventListener("gallery-ready", () => {
    const G = window.TRIP_GALLERY || [];
    const placed = G.map((p, i) => ({ p, i })).filter(x => x.p.lat != null && x.p.lng != null);
    if (!placed.length) return;
    const dir = (window.TRIP_DIR || "") + "gallery/t/";
    const photoLayer = L.layerGroup().addTo(map);
    const draw = () => {
      photoLayer.clearLayers();
      const groups = [];
      placed.forEach(x => {
        const pt = map.latLngToLayerPoint([x.p.lat, x.p.lng]);
        const g = groups.find(g => g.pt.distanceTo(pt) < 44);
        g ? g.items.push(x) : groups.push({ pt, items: [x] });
      });
      groups.forEach(g => {
        const x = g.items[0], n = g.items.length;
        const icon = L.divIcon({ className: "", iconSize: [40, 40], iconAnchor: [20, 50],   // standing above the spot, clear of the day markers
          html: `<div class="map-photo" style="background-image:url('${esc(dir + x.p.f)}')">${n > 1 ? `<span>${n}</span>` : ""}</div>` });
        L.marker([x.p.lat, x.p.lng], { icon, zIndexOffset: 500 })
          .on("click", () => {
            // A big group, zoomed out: zoom in on it first, so it splits up.
            if (n > 1 && map.getZoom() < 15) {
              const b = L.latLngBounds(g.items.map(y => [y.p.lat, y.p.lng]));
              if (b.getNorthEast().distanceTo(b.getSouthWest()) > 50) return map.fitBounds(b.pad(0.3), { maxZoom: 17 });
            }
            window.openGallery && window.openGallery(x.i);
          })
          .addTo(photoLayer);
      });
    };
    map.on("zoomend viewreset resize", draw);   // resize: the map tab opening
    draw();
    const row = $("mapControls").querySelector(".chip-row");
    if (row) {
      row.insertAdjacentHTML("beforeend", `<label class="chip" data-phase="photos"><input type="checkbox" checked> 📷 Photos (${placed.length})</label>`);
      const chip = row.lastElementChild, cb = chip.querySelector("input");
      cb.addEventListener("change", () => {
        if (cb.checked) { map.addLayer(photoLayer); chip.classList.remove("off"); }
        else { map.removeLayer(photoLayer); chip.classList.add("off"); }
      });
    }
  });
})();

/* --- The map, offline -------------------------------------------------------
   A trip's site can carry its own map: a cut of OpenStreetMap data round every
   place it stops (scripts/make-offline-map.js, at publish), described by
   offline-map.json: street-level squares round each stop, over a lighter
   overview of the whole route area (the squares alone left grey gaps between
   stops when zoomed out).

   It sits UNDER the usual map. With signal, Esri's map loads on top and looks
   as it always has; without, Esri's tiles fail and ours shows through wherever
   they are missing — no guessing whether there is signal. A card under the map
   saves both files on the phone; the service worker then serves them from
   there (mapPiece in sw.js), so the whole route works with no signal, zoomed
   in to street level.

   The usual map (Esri's) may not be saved ahead of time under its terms, which
   is why this is our own. The satellite view stays online-only. */
(function(){
  if (!map || window.__PREVIEW__) return;
  const host = $("offlineMapCard");
  const MAP_CACHE = "trip-map-v1";
  const MAP_LIB = "https://cdn.jsdelivr.net/npm/protomaps-leaflet@5.1.0/dist/protomaps-leaflet.js";
  const JSON_URL = new URL(window.TRIP_DIR + "offline-map.json", location.href).href;
  const mb = n => (n / 1e6).toFixed(n < 1e7 ? 1 : 0) + " MB";
  let info = null, urls = [];

  const loadScript = src => new Promise((ok, fail) => {
    const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });

  async function saved(){
    try {
      const c = await caches.open(MAP_CACHE);
      for (const u of urls) if (!(await c.match(u))) return false;
      return urls.length > 0;
    } catch(e){ return false; }
  }

  async function draw(state, pct){
    if (!info) return;
    const has = state ? state === "saved" : await saved();
    host.innerHTML = `<div class="info-card offline-map">
      <h4>🗺 The map without signal</h4>
      ${state === "saving"
        ? `<p class="placeholder">Saving the map… ${pct != null ? pct + "%" : ""} Keep the app open until it finishes.</p>`
        : has
          ? `<p class="placeholder"><b>Saved on this phone.</b> The whole route works without signal, down to street level.</p>
             <button type="button" class="cal-add" id="offlineMapRemove">Remove it (frees ${mb(info.totalBytes || info.bytes)})</button>`
          : `<p class="placeholder">With signal the map works as normal. To have it with <b>no signal</b> too, save it to this phone — ${mb(info.totalBytes || info.bytes)}, best on wifi before you go.</p>
             <button type="button" class="card-btn" id="offlineMapSave">Save map for offline</button>
             ${state === "failed" ? `<p class="placeholder" style="color:var(--alert)">That didn't finish — check the connection and try again.</p>` : ""}`}
      <p class="placeholder" style="font-size:calc(12px * var(--fs));margin-top:8px">Without signal the map is OpenStreetMap's (via Protomaps), so it looks a little different. The Hybrid (satellite) view needs signal.</p>
    </div>`;
    const save = $("offlineMapSave"), remove = $("offlineMapRemove");
    if (save) save.addEventListener("click", saveMap);
    if (remove) remove.addEventListener("click", async () => {
      try { const c = await caches.open(MAP_CACHE); for (const u of urls) await c.delete(u); } catch(e){}
      tellWorker(); draw();
    });
  }

  const tellWorker = () => { try { navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage("map-changed"); } catch(e){} };

  async function saveMap(){
    draw("saving", 0);
    try {
      const total = info.totalBytes || info.bytes;
      const blobs = [];
      let got = 0, shown = -1;
      for (const u of urls){
        const res = await fetch(u, { cache: "no-store" });
        if (!res.ok || !res.body) throw new Error("HTTP " + res.status);
        const reader = res.body.getReader(), parts = [];
        for (;;){
          const { done, value } = await reader.read();
          if (done) break;
          parts.push(value); got += value.length;
          const pct = Math.min(99, Math.floor(got / total * 100));
          if (pct !== shown){ shown = pct; draw("saving", pct); }
        }
        blobs.push(new Blob(parts));
      }
      const cache = await caches.open(MAP_CACHE);
      // One map per trip site: a newer cut replaces the old one.
      for (const k of await cache.keys()) if (!urls.includes(k.url) && k.url !== JSON_URL && k.url !== MAP_LIB) await cache.delete(k);
      for (let i = 0; i < urls.length; i++)
        await cache.put(urls[i], new Response(blobs[i], { headers: { "Content-Type": "application/octet-stream", "Content-Length": String(blobs[i].size) } }));
      // Beside the map, where no app update clears them: what the map is, and
      // the library that draws it. Without them a saved map went unused.
      await cache.put(JSON_URL, new Response(JSON.stringify(info), { headers: { "Content-Type": "application/json" } }));
      try { await cache.put(MAP_LIB, await fetch(MAP_LIB, { mode: "no-cors" })); } catch(e){}
      // The library that draws it must be on the phone too. It is kept the
      // first time it is fetched through the service worker — which a very
      // first visit is not — so fetch it again now, while there is signal.
      try { await fetch(MAP_LIB, { mode: "no-cors" }); } catch(e){}
      // Ask the phone not to clear it to make room; it may say no, and that's fine.
      try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
      tellWorker();
      draw("saved");
    } catch(e){ draw("failed"); }
  }

  const fromSaved = () => caches.open(MAP_CACHE).then(c => c.match(JSON_URL)).then(r => r ? r.json() : null).catch(() => null);
  fetch(JSON_URL, { cache: "no-store" })
    .then(r => r.ok ? r.json() : fromSaved(), fromSaved)
    .then(async j => {
      if (!j || !j.file) return;
      info = j;
      const abs = f => new URL(window.TRIP_DIR + f, location.href).href;
      const detailUrl = abs(j.file), overviewUrl = j.overview ? abs(j.overview.file) : null;
      urls = [detailUrl].concat(overviewUrl ? [overviewUrl] : []);
      await loadScript(MAP_LIB);
      if (typeof protomapsL === "undefined") return;
      // Beneath Leaflet's own tile pane (z-index 200), so Esri's map covers it
      // whenever it loads.
      map.createPane("ownMap").style.zIndex = 150;
      const own = (u, maxz, z) => protomapsL.leafletLayer({ url: u, flavor: "light", lang: "en", maxDataZoom: maxz, pane: "ownMap", zIndex: z,
        attribution: '&copy; <a href="https://openstreetmap.org/copyright" target="_blank" rel="noreferrer">OpenStreetMap</a> contributors, <a href="https://protomaps.com" target="_blank" rel="noreferrer">Protomaps</a>' });
      if (overviewUrl) own(overviewUrl, j.overview.maxzoom, 1).addTo(map);
      const detail = own(detailUrl, j.maxzoom, 2);
      // The library paints its style's background on every tile it draws,
      // including the ones where this layer has no data — which covered the
      // overview beneath with grey between the stops. Without it, those parts
      // are see-through and the overview shows.
      if (overviewUrl) detail.backgroundColor = undefined;
      detail.addTo(map);

      /* With no signal, ours must show. Esri's layer sits on top, and Leaflet
         keeps a failed tile's zoomed-out parent on screen, stretched — so in
         airplane mode the map was Esri's old tiles blown up, over ours. Hide
         Esri's street map once the phone is offline or one of its tiles fails,
         for the rest of this visit; ours is complete, so nothing is lost. */
      const street = map.__street;
      let ownOnly = false;
      const hideStreet = () => { const c = street && street.getContainer && street.getContainer(); if (c) c.style.visibility = "hidden"; };
      const useOwn = () => { ownOnly = true; hideStreet(); };
      if (street) {
        if (navigator.onLine === false) useOwn();
        street.on("tileerror", useOwn);
        street.on("add", () => { if (ownOnly) setTimeout(hideStreet, 0); });
      }
      window.addEventListener("offline", useOwn);
      draw();
    })
    .catch(() => {});
})();

// When the map is manually resized, Leaflet needs telling to re-measure itself and
// redraw — otherwise the map view stays cropped to its old size.
if (map && typeof ResizeObserver !== "undefined"){
  let resizeDebounce;
  new ResizeObserver(()=>{
    clearTimeout(resizeDebounce);
    resizeDebounce = setTimeout(()=>{ try { map.invalidateSize(); } catch(e){} }, 120);
  }).observe($("map"));
}

// Custom drag-to-resize handle (desktop only, via the pointer:fine media query on
// its CSS) — a visible grip glued to the map's actual corner. Since #map centers
// itself with left:50%+transform (the only way to center a box that can be wider
// than its container — margin:auto gets clamped to zero by browsers in that case),
// the handle's position is computed from the map's real rendered position each
// time, rather than assumed from a fixed offset.
(function(){
  const handle = $("mapResizeHandle");
  const mapEl = $("map");
  const wrapperEl = $("mapWrapper");
  if (!map || !handle || !mapEl || !wrapperEl) return;
  let startX = 0, startY = 0, startWidth = 0, startHeight = 0, dragging = false;
  const MIN_H = 300, MAX_H = Math.round(window.innerHeight * 0.85);
  const MIN_W = 300, MAX_W = Math.round(window.innerWidth * 0.95);
  const HANDLE_SIZE = 30;

  function positionHandle(){
    const mapRect = mapEl.getBoundingClientRect();
    const wrapRect = wrapperEl.getBoundingClientRect();
    handle.style.left = Math.round(mapRect.right - wrapRect.left - HANDLE_SIZE - 6) + "px";
    handle.style.top = Math.round(mapRect.bottom - wrapRect.top - HANDLE_SIZE - 6) + "px";
    handle.style.right = "auto";
    handle.style.bottom = "auto";
  }
  window.__positionMapResizeHandle = positionHandle; // exposed so tab-switch code can re-call it

  function onMove(e){
    if (!dragging) return;
    const x = e.touches ? e.touches[0].clientX : e.clientX;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const newHeight = Math.max(MIN_H, Math.min(MAX_H, startHeight + (y - startY)));
    const newWidth = Math.max(MIN_W, Math.min(MAX_W, startWidth + (x - startX)));
    mapEl.style.height = newHeight + "px";
    mapEl.style.width = newWidth + "px";
    positionHandle();
    if (e.cancelable) e.preventDefault();
  }
  function onUp(){
    if (!dragging) return;
    dragging = false;
    document.body.style.userSelect = "";
    try { map.invalidateSize(); } catch(e){}
    positionHandle();
  }
  function onDown(e){
    dragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startY = e.touches ? e.touches[0].clientY : e.clientY;
    const rect = mapEl.getBoundingClientRect();
    startWidth = rect.width;
    startHeight = rect.height;
    document.body.style.userSelect = "none";
    e.preventDefault();
  }
  handle.addEventListener("mousedown", onDown);
  handle.addEventListener("touchstart", onDown, { passive:false });
  window.addEventListener("mousemove", onMove, { passive:false });
  window.addEventListener("touchmove", onMove, { passive:false });
  window.addEventListener("mouseup", onUp);
  window.addEventListener("touchend", onUp);
  setTimeout(positionHandle, 100);
})();

/* --- Trek (optional module) ----------------------------------------------- */
(function(){
  const t = TRIP.trek || {};
  const el = $("trekProgress");
  if (!t.enabled){ el.innerHTML = ""; return; }

  const trekDays = DAYS.filter(d => d.trekKm != null);
  const total = t.totalKm || trekDays.reduce((s,d)=>s+d.trekKm, 0);
  const liveUrl = (TRIP.links||{}).liveTracker || "";
  // Fixed to the trek's own area, never today's location — otherwise on a
  // non-trek day this card shows somewhere entirely unrelated to the trek.
  const mapsUrl = (t.areaLat != null)
    ? `https://www.google.com/maps/search/?api=1&query=${t.areaLat},${t.areaLng}` : "";

  const buttons = (liveUrl || mapsUrl) ? `<div class="portal-btn-group" style="margin-top:10px;">
      ${liveUrl ? `<a class="card-btn link portal-btn" style="background:var(--success)" href="${esc(liveUrl)}" target="_blank" rel="noreferrer">${TRIP.keepsake ? "🛰 The route on the satellite tracker" : "🛰 View Live Tracker"} ↗</a>` : ""}
      ${mapsUrl ? `<a class="card-btn link portal-btn" style="background:#fff;color:var(--primary);border:1.5px solid var(--primary)" href="${esc(mapsUrl)}" target="_blank" rel="noreferrer">📍 Trek area on Google Maps ↗</a>` : ""}
    </div>${t.noPhoneNote ? `<p class="trek-note" style="border-top:none;padding-top:0;margin-top:6px;">${tokEsc(t.noPhoneNote)}</p>` : ""}` : "";

  const firstTrek = trekDays.length ? trekDays[0].n : Infinity;
  let km = 0;
  if (status === "after") km = total;
  else if (status === "during"){
    const h = parseInt(new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",hour12:false}).format(new Date()),10);
    const s = t.startHour!=null?t.startHour:8, e = t.endHour!=null?t.endHour:17;
    trekDays.forEach(d => {
      if (currentDayNum > d.n) km += d.trekKm;
      else if (currentDayNum === d.n) km += Math.round(d.trekKm * Math.min(1, Math.max(0, (h-s)/(e-s))));
    });
  }
  km = Math.min(km, total);
  const pct = total ? Math.round(km/total*100) : 0;
  const notStarted = status === "before" || currentDayNum < firstTrek;

  el.innerHTML = `<div class="trek-progress">
      <h4>🥾 ${tokEsc(t.title || "The trek")}</h4>
      <p class="trek-sub">${notStarted
        ? `${esc(t.dates||"")} · ${tokEsc(t.blurb||"")} Progress will appear here once the trek starts.`
        : (km >= total ? `Trek complete — ${P.subj} did it! 🎉${TRIP.keepsake && (t.dates || t.blurb) ? `<br>${esc(t.dates||"")}${t.dates && t.blurb ? " · " : ""}${tokEsc(t.blurb||"")}` : ""}` : `Estimated from the itinerary — ${P.be} earning every step.`)}</p>
      <div class="trek-track">
        <div class="trek-fill" style="width:${notStarted?0:pct}%"></div>
        ${notStarted ? "" : `<div class="trek-boots" style="left:${Math.max(3,Math.min(97,pct))}%">🥾</div>`}
      </div>
      <div class="trek-stats"><span>${notStarted?0:km} km</span><span>~${total} km</span></div>
      ${buttons}
      ${t.note ? `<p class="trek-note">${tokEsc(t.note)}</p>` : ""}
    </div>`;
})();

/* --- Info tab ------------------------------------------------------------- */
(function(){
  const L_ = TRIP.links || {};

  // Rendered once, on whichever card is the first to show times.
  function timeToggle(){
    const here = timeMode() === "here";
    const zone = viewerZoneLabel();
    const where = TRIP.trip.destinationLabel || "there";
    return `<div class="seg-row"><span>Show times in:</span>
      <span class="seg" role="group" aria-label="Which timezone to show times in">
        <button type="button" class="time-mode" data-mode="there" aria-pressed="${!here}">Their time</button>
        <button type="button" class="time-mode" data-mode="here" aria-pressed="${here}">My time${zone?` (${esc(zone)})`:""}</button>
      </span>
      <span style="flex-basis:100%;font-size:calc(12px * var(--fs))">${here
        ? `Times shown in your own timezone.`
        : `Times shown local to each place — e.g. ${esc(where)} time, not yours.`}</span></div>`;
  }

  function flightsCard(){
    if (!FLIGHTS.length) return "";
    // A keepsake keeps every flight as the record of the journey. During the
    // trip only what is still ahead shows, which once it is over is nothing.
    if (TRIP.keepsake) {
      const TK = {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"};
      return `<div class="info-card"><h4>✈️ The flights</h4>
        <p class="placeholder" style="margin-bottom:8px;">Each in its own airport's local time.</p>
        ${FLIGHTS.map(f => `<div class="flight-row done"><div class="flight-info">
          <div class="flight-main"><b>${esc(f.no)}</b> ${esc(f.from)} → ${esc(f.to)}</div>
          <div class="flight-times">${f.dep ? "Dep " + fmtAt(f.dep, TK) + " &middot; " : ""}Arr ${fmtAt(f.arr, TK)}</div>
        </div></div>`).join("")}</div>`;
    }
    let prevArr = null;
    const withStatus = FLIGHTS.map(f => { const st = flightStatus(f, prevArr); prevArr = new Date(f.arr); return {f,st}; });
    const upcoming = withStatus.filter(x => x.st.cls !== "done");
    // Which kind of status the rows below are: the airline's data, or the
    // schedule. Said once, above them, as well as in each label.
    function liveNote(){
      if (!LIVE_ON) return "Times and status below are the schedule, not live.";
      if (!__liveMeta) return "Live status not available yet — times and status below are the schedule.";
      if (__liveMeta.capReached) return "Live status paused for the rest of the month — times and status below are the schedule.";
      const t = new Date(__liveMeta.generated).toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
      return `Live status from the airlines' data, last updated ${t} your time.`;
    }
    if (!upcoming.length) return "";
    const T = {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"};
    const rows = upcoming.map(({f,st}) => {
      // Each leg shown in its own airport's local time, as an airline would.
      const d = f.dep ? fmtAt(f.dep, T) : "—";
      const a = fmtAt(f.arr, T);
      const live = st.cls.split(" ").includes("live");
      const fr = f.no.replace(/[^A-Za-z0-9]/g,"").toLowerCase();
      return `<div class="flight-row ${st.cls}" data-flight="${esc(f.no)}">
        <div class="flight-info">
          <div class="flight-main"><b>${esc(f.no)}</b> ${esc(f.from)} → ${esc(f.to)}</div>
          <div class="flight-times">Dep ${d} &middot; Arr ${a}</div>
          <div class="flight-status">${st.label}</div>
          <div style="margin-top:6px">${calButton(eventKeyFor("flight", f))}</div>
        </div>
        <a href="https://www.flightradar24.com/data/flights/${esc(fr)}" target="_blank" rel="noreferrer"
           class="card-btn link flight-track-btn ${live?'flight-track-btn-live':''}">${live?'✈️ Track live now':'Track live'} ↗</a>
      </div>`;
    }).join("");
    const done = FLIGHTS.length - upcoming.length;
    return `<div class="info-card"><h4>✈️ Flights</h4>
      ${done>0 ? `<p class="placeholder" style="margin-bottom:8px;">${done} of ${FLIGHTS.length} past their scheduled arrival — only showing what's ahead.</p>` : ""}
      ${timeToggle()}
      <p class="placeholder" style="margin-bottom:4px;">Tap "Track live" for the real position via Flightradar24.</p>
      <p id="liveCheckedNote" class="placeholder" style="font-size:calc(12px * var(--fs));margin:0 0 10px;">${liveNote()}</p>
      ${rows}
      ${LIVE_ON
        // Required by the AeroDataBox plan the live status comes from (RapidAPI
        // BASIC: "Terms of Use: Attribution — required").
        ? `<p class="placeholder" style="font-size:calc(12px * var(--fs));margin:10px 0 0">Live flight data by <a href="https://aerodatabox.com" target="_blank" rel="noreferrer">AeroDataBox</a></p>` : ""}
      ${costLine("flights")}${costLine("seats")}</div>`;
  }

  // Optional module — absent from the Cambodia config entirely, so it simply
  // never renders there.
  // Today's date on the trip's clock, not the viewer's. Someone checking in
  // from the UK at 1am sees the same day the family is actually living.
  function tripToday(){
    return destToday();
  }

  // Stays behave like the itinerary, eating and considering lists: once you've
  // checked out, a stay stops being something you need and becomes clutter
  // above the one you're actually in. Kept in date order rather than sorted by
  // relevance — accommodation is a sequence, and seeing it out of order would
  // be worse than scrolling.
  //
  // "Past" is `today > to`, not `>= to`: on checkout morning you still want the
  // address and the 11am deadline in front of you.
/* Who is reading this?

   On the Texas trip the readers were the people travelling: "Directions" meant
   drive here, the link was their own booking, and the phone number was the desk
   they would ring on arrival. On an expedition the readers are at home, and
   every one of those is wrong — nobody in Guildford is driving to a lodge on
   the Kinabatangan, and there is no booking in their name.

   The phone number is the one that matters. These apps carry a contacts section
   naming who to ring and in what order, precisely so a worried parent does not
   improvise. A lodge's direct line sitting beside the bed invites exactly the
   call that section exists to prevent — at three in the morning, local time, to
   somebody with no idea who is asking.

   `trip.audience: "at-home"` switches the labels and drops the number. Absent
   means travelling, so every existing config is unchanged. */
  const AT_HOME = (TRIP.trip || {}).audience === "at-home";

  // One night's — or one week's — accommodation. `now` means the trip is
  // inside this stay's window today; see SECTIONS for who decides that.
  function stayRow(s, now){
    const f = new Date(s.from+"T12:00:00Z"), t = new Date(s.to+"T12:00:00Z");
    const fmt = d => d.toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
    return `<div class="stay ${now?'current':''}">
        <div class="stay-when">${fmt(f)} – ${fmt(t)}${now?" · here now":""}</div>
        <div class="stay-name">${esc(s.name)}${s.area?` <span style="font-weight:400;color:var(--text-muted)">· ${esc(s.area)}</span>`:""}</div>
        ${s.address?`<div class="stay-note">${esc(s.address)}</div>`:""}
        ${s.note?`<div class="stay-note">${esc(s.note)}</div>`:""}
        ${s.ref?`<div class="stay-note">Booking ref: <b>${esc(s.ref)}</b></div>`:""}
        ${costLine(s.name)}
        ${linkRow([
          s.satNav  && [AT_HOME ? "📍 Where this is" : "🧭 Directions", s.satNav],
          s.link    && ["🔗 " + (s.linkLabel || (AT_HOME ? "Website" : "Booking")), s.link],
          s.appLink && ["📱 Open " + (s.appName || "app"), s.appLink, s.appName],
          !AT_HOME && s.phone && ["📞 " + s.phone, "tel:" + String(s.phone).replace(/[^\d+]/g,"")],
        ])}
      </div>`;
  }

  // Own host element so the toggle can redraw just this card, rather than
  // rebuilding the whole Info tab and throwing you back to the top of it.
  function stayCard(){ return `<div id="stayHost"></div>`; }

  // Small row of tappable chips. Skips anything not supplied, and renders
  // nothing at all if none are — so a stay with no links looks the same as before.
  // App-scheme attempt for "Open {app}" buttons — see APP_SCHEMES up top for why.
  function openApp(e, scheme){
    e.preventDefault();
    const href = e.currentTarget.href;
    const start = Date.now();
    let backgrounded = false;
    const onHide = () => { if (document.hidden) backgrounded = true; };
    document.addEventListener("visibilitychange", onHide);
    window.location.href = scheme;
    setTimeout(() => {
      document.removeEventListener("visibilitychange", onHide);
      // If the tab never went to the background, nothing intercepted the
      // scheme — the app isn't installed, or doesn't own it. Also skip the
      // fallback if this fired long after the tap (e.g. a system dialog like
      // "Cannot Open Page" was on screen), since that usually means the app
      // browser is about to return control on its own.
      if (!backgrounded && Date.now() - start < 2500) window.open(href, "_blank");
    }, 1200);
  }

  function linkRow(pairs){
    const live = (pairs||[]).filter(Boolean);
    if (!live.length) return "";
    return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">` +
      live.map(([label, href, appName]) => {
        const scheme = appName && APP_SCHEMES[appName.toLowerCase()];
        return `<a href="${esc(tripFile(href))}" target="_blank" rel="noreferrer"
            ${scheme ? `onclick="openApp(event, '${esc(scheme)}')"` : ""}
            style="font-size:calc(13px * var(--fs));font-weight:600;text-decoration:none;color:var(--primary);
                   border:1.5px solid var(--border-strong);background:#fff;border-radius:16px;
                   padding:5px 10px;white-space:nowrap">${esc(label)}</a>`;
      }).join("") +
      `</div>`;
  }

  /* --- MODULE: Bookings ---------------------------------------------------
     Everything that isn't accommodation or the hire car — flights, event
     tickets, activities. Optional: no `bookings` key, no card.

     A family trip wants all of this in one place; a school expedition doesn't
     have it at all, which is why it's a module rather than a fixed section. */
  /* --- MODULE: Costs ------------------------------------------------------
     Splits are shown as the trip happens, so people can settle up on the day
     rather than reconstructing it all afterwards. The app only ever displays
     what's owed and links out to a payment app — it never handles money. */
  const COSTS = window.TRIP_COSTS || null;

  function costMoney(n, sym){
    if (sym == null) sym = (COSTS && COSTS.currencySymbol) || "";
    return sym + n.toLocaleString("en-GB", {minimumFractionDigits:2, maximumFractionDigits:2});
  }

  // What people are actually asked for. The payer was charged in their own
  // currency at their card's rate, so settling in the trip's currency would
  // leave them short on the conversion back — everything owed is therefore
  // expressed in homeCurrency. `charged` (off the statement) wins when known;
  // otherwise convert at `rate` and mark it an estimate.
  const homeSym = (COSTS && COSTS.homeCurrencySymbol) || (COSTS && COSTS.currencySymbol) || "";
  function costHome(item){
    if (!COSTS) return null;
    if (item.charged != null) return { total: item.charged, estimated: false };
    if (item.amount == null) return null;
    if (COSTS.homeCurrency && COSTS.rate) return { total: item.amount * COSTS.rate, estimated: true };
    return { total: item.amount, estimated: false };   // single-currency trip
  }
  function costHomeMoney(n){ return costMoney(n, homeSym); }

  // Who shares an item, defaulting to everyone.
  function costSharers(item){
    const all = (COSTS && COSTS.people) || [];
    return (Array.isArray(item.split) && item.split.length) ? item.split : all;
  }

  function costItemFor(what){
    if (!COSTS || !Array.isArray(COSTS.items)) return null;
    return COSTS.items.find(i => i.what === what) || null;
  }

  // One line under a booking/stay/car: the per-head figure at the moment it matters.
  function costLine(what){
    const item = costItemFor(what);
    if (!item) return "";
    const home = costHome(item);
    if (!home) {
      return `<div class="stay-note" style="color:var(--text-muted)">💷 Cost not filled in yet${item.paidBy?` · paid by ${esc(item.paidBy)}`:""}</div>`;
    }
    const sharers = costSharers(item);
    if (!sharers.length) return "";
    const each = home.total / sharers.length;
    // Only worth showing the ticket price when it's a different currency AND
    // we actually have it — items priced straight in GBP have no `amount`.
    const ticket = (item.amount != null && COSTS.homeCurrency && COSTS.homeCurrency !== COSTS.currency)
      ? ` (${costMoney(item.amount)})` : "";
    return `<div class="stay-note"><b>💷 ${home.estimated?"≈":""}${esc(costHomeMoney(each))} each</b>
      <span style="color:var(--text-muted)">· ${esc(costHomeMoney(home.total))}${esc(ticket)} split ${sharers.length} ways${item.paidBy?`, paid by ${esc(item.paidBy)}`:""}</span>
      ${home.estimated?`<span style="color:var(--text-muted)"> · estimated until the statement lands</span>`:""}</div>`;
  }

  // Running total of what each person owes each payer across the whole trip.
  // Everything here is in homeCurrency. `estimated` rides along so the summary
  // can say which totals are still provisional.
  function costTotals(){
    const owed = {};
    (COSTS.items || []).forEach(item => {
      if (!item.paidBy) return;
      const home = costHome(item);
      if (!home) return;
      const sharers = costSharers(item);
      if (!sharers.length) return;
      const each = home.total / sharers.length;
      sharers.forEach(p => {
        if (p === item.paidBy) return;
        owed[p] = owed[p] || {};
        const cur = owed[p][item.paidBy] || { total:0, estimated:false };
        cur.total += each;
        cur.estimated = cur.estimated || home.estimated;
        owed[p][item.paidBy] = cur;
      });
    });
    return owed;
  }

  function costsCard(){
    if (!COSTS || !Array.isArray(COSTS.items) || !COSTS.items.length) return "";
    const priced  = COSTS.items.filter(i => costHome(i));
    const missing = COSTS.items.filter(i => !costHome(i));
    const anyEst  = priced.some(i => costHome(i).estimated);
    const owed    = costTotals();
    const settle  = COSTS.settleUp || {};

    const people = (COSTS.people || []).map(p => {
      const to = owed[p];
      if (!to) return `<div class="stay"><div class="stay-name">${esc(p)}</div>
        <div class="stay-note" style="color:var(--text-muted)">Nothing outstanding.</div></div>`;
      const lines = Object.keys(to).map(payer =>
        `<div class="stay-note">Owes <b>${to[payer].estimated?"≈":""}${esc(costHomeMoney(to[payer].total))}</b> to ${esc(payer)}</div>`).join("");
      return `<div class="stay"><div class="stay-name">${esc(p)}</div>${lines}
        ${settle.link?linkRow([["💷 " + (settle.label || "Settle up"), settle.link]]):""}</div>`;
    }).join("");

    const total = priced.reduce((s,i) => s + costHome(i).total, 0);
    const diffCur = COSTS.homeCurrency && COSTS.homeCurrency !== COSTS.currency;

    return `<div class="info-card"><h4>💷 Costs &amp; settling up</h4>
      <p class="placeholder" style="margin-bottom:10px">
        ${priced.length} item${priced.length===1?"":"s"} totalling <b>${anyEst?"≈":""}${esc(costHomeMoney(total))}</b>${missing.length?` · ${missing.length} still to be filled in`:""}.
        Splits show on each booking as you go.</p>
      ${diffCur?`<p class="placeholder" style="margin-bottom:10px;font-size:calc(13px * var(--fs))">
        Everything is settled in ${esc(COSTS.homeCurrency)} — the payer's card converted from ${esc(COSTS.currency)} at its own rate, so repaying in ${esc(COSTS.currency)} would leave them short.${anyEst?` Figures marked ≈ are converted at ${esc(String(COSTS.rate))} and firm up once the statement lands.`:""}</p>`:""}
      ${people}
      ${settle.link?"":`<p class="placeholder" style="margin-top:10px;font-size:calc(13px * var(--fs))">${esc(settle.note || "Add a payment link in the costs file to make these tappable.")}</p>`}
      </div>`;
  }

  const fmtBookingDate = d => d ? new Date(d+"T12:00:00Z").toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"}) : null;

  // Bookings are read in date order, so render them that way rather than
  // trusting the order they happen to sit in the config — dates get added and
  // corrected over time and the file drifts out of sequence. Undated ones
  // (nothing pencilled in yet) fall to the end, keeping their config order
  // among themselves since sort is stable.
  function sortBookings(list){
    return list.slice().sort((a, b) => {
      if (a.when && b.when) return a.when < b.when ? -1 : a.when > b.when ? 1 : 0;
      if (a.when) return -1;
      if (b.when) return 1;
      return 0;
    });
  }

  function bookingRow(b, here){
    return `<div class="stay ${b.done?'been ':''}${here?'current':''}">
        ${b.when ? `<div class="stay-when">${esc(fmtBookingDate(b.when))}${b.time?` · ${esc(b.time)}`:""}</div>`
                 : here ? `<div class="stay-when">near you now</div>` : ""}
        <div class="stay-name">${esc(b.what || "Booking")}${b.provider?` <span style="font-weight:400;color:var(--text-muted)">· ${esc(b.provider)}</span>`:""}${b.done?doneChip:""}</div>
        ${b.address?`<div class="stay-note">${esc(b.address)}</div>`:""}
        ${b.beThereBy?`<div class="stay-note" style="font-weight:600;color:var(--alert)">⏰ ${esc(b.beThereBy)}</div>`:""}
        ${b.note?`<div class="stay-note">${esc(b.note)}</div>`:""}
        ${b.ref?`<div class="stay-note">Ref: <b>${esc(b.ref)}</b></div>`:""}
        ${costLine(b.what)}
        ${linkRow([
          b.satNav  && ["🧭 Directions", b.satNav],
          b.link    && ["🔗 " + (b.linkLabel || "Booking"), b.link],
          b.appLink && ["📱 Open " + (b.appName || "app"), b.appLink, b.appName],
          b.phone   && ["📞 " + b.phone, "tel:" + String(b.phone).replace(/[^\d+]/g,"")],
        ])}
        ${b.when && !b.done ? `<div style="margin-top:6px">${calButton(eventKeyFor("booking", b))}</div>` : ""}
      </div>`;
  }

  // Kept in date order rather than sorted by relevance, same reasoning as the
  // stays: bookings are a sequence, and shuffling today's to the top would read
  // as wrong. Done ones drop behind a toggle instead.
  //
  // "Past" is `today > when`, so a booking stays put all the day it happens —
  // you want the seat numbers and the be-there-by time in front of you on the
  // day, not filed away that morning. Undated entries never expire.
  //
  // The `here` flag is computed here, not passed straight into .map(): map's
  // callback signature is (element, index, array), so `list.map(bookingRow)`
  // silently fed the array index into bookingRow's second parameter — index 0
  // is falsy and everything else truthy, which made the green highlight mean
  // "not first in the list" rather than "today".
  /* --- MODULE: Eating -----------------------------------------------------
     Somewhere to eat, kept apart from `bookings` because nothing here is
     booked — these are picks to choose between when the question is "where
     are we eating tonight". Optional: no `eating` key, no card. */
  // Each entry carries the window of days it's any use — `from`/`to`, keyed to
  // where the trip actually is. Somewhere in Fort Worth is noise once you're in
  // Houston, so once its window has passed it drops off, the same way earlier
  // days drop off the itinerary. Nothing is deleted: a toggle brings them back.
  /* A `done:true` entry is one you actually went to. It earns a tick, and it
     stops competing for attention: `done` counts as past, so it drops out of
     the live list even while its date window is still open — otherwise the
     Katy Buc-ee's would still be offering itself two days after you'd been.

     Once the trip is over and every section opens up, the tick is what
     separates "we did this" from "we looked at it and didn't", which is the
     more interesting half of a finished trip. */
  const doneChip = `<span style="display:inline-block;font-size:calc(11.5px * var(--fs));font-weight:600;letter-spacing:.02em;
      color:var(--success);background:var(--bg);border:1px solid var(--success);border-radius:10px;
      padding:1px 7px;margin-left:6px;vertical-align:1px">✓ been</span>`;

  /* What order the opened-up list runs in, which depends entirely on what the
     list is FOR at that moment.

     During the trip it is a set of options: things still worth doing come
     first, things you've passed sink to the bottom. A place you have already
     been is noise when the question is where to go tonight.

     Once the trip is over the same list stops being options and becomes a
     record, and the interesting half inverts — what was actually done is the
     bit worth reading, and what was never taken up is the footnote. So `done`
     entries rise to the top, in the order they were ranked.

     Note this keys off `done` rather than `past`: "we went" and "the date has
     been and gone" are different claims, and only the first is a memory. */
  function pastOrder(ranked, live, gone){
    if (status !== "after") return live.concat(gone);
    return ranked.filter(r =>  r.it.done)
           .concat(ranked.filter(r => !r.it.done));
  }

  function eatingRow(e, here){
    return `<div class="stay ${e.done?'been ':''}${here?'current':''}">
        ${here?`<div class="stay-when">near you now</div>`:""}
        <div class="stay-name">${esc(e.what || "")}${e.area?` <span style="font-weight:400;color:var(--text-muted)">· ${esc(e.area)}</span>`:""}${e.price?` <span style="font-weight:600;color:var(--success)">${esc(e.price)}</span>`:""}
          ${e.kind?`<span style="display:inline-block;font-size:calc(11.5px * var(--fs));font-weight:600;letter-spacing:.02em;color:var(--primary);background:var(--bg);border:1px solid var(--border-strong);border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:1px">${esc(e.kind)}</span>`:""}${e.done?doneChip:""}</div>
        ${e.address?`<div class="stay-note">${esc(e.address)}</div>`:""}
        ${e.note?`<div class="stay-note">${esc(e.note)}</div>`:""}
        ${linkRow([
          e.satNav && ["🧭 Directions", e.satNav],
          e.link   && ["🔗 Website",    e.link],
          e.phone  && ["📞 " + e.phone, "tel:" + String(e.phone).replace(/[^\d+]/g,"")],
        ])}
      </div>`;
  }

  /* --- MODULE: Road stops -------------------------------------------------
     Things you stop at because you're already driving past, as opposed to
     places you set out for. Kept apart from `eating` and from `considering`
     because mixing them buries both: a Buc-ee's is noise in a list of
     restaurants you're choosing between, and a five-minute leg-stretch reads
     as an outing when it sits next to a zoo.

     Same shape as the eating list — `from`/`to` windows, whatever's near you
     first, passed ones behind a toggle. Optional: no `roadStops` key, no tab. */

  /* --- Every list section, described rather than written out --------------
     Stays, bookings, being-considered, on-the-way and where-to-eat were five
     functions doing the same four things: work out what is behind you and
     what is reachable today, order those two groups, put the passed ones
     behind a toggle, and render rows under a heading. Five copies meant five
     places to edit and five chances to let them drift — which had already
     happened twice, in the `done` handling and the toggle wording.

     So the differences live here as data, and the machinery lives once in
     sectionCard() below. A new list is an entry in this table.

       items     where the entries come from, read fresh each render
       order     "given"   take the list as it arrives (already in date order)
                 "nearest" float whatever is reachable today to the top, then
                           by start date, then config order
       past      what counts as behind you — a checkout date, an event date,
                 or a `done` flag
       here      what counts as reachable right now; earns the green highlight
       opened    what the list looks like with the passed ones showing:
                 "given" leaves them where they fall, "sink" drops them to the
                 bottom (and, once the trip is over, floats `done` to the top —
                 see pastOrder)
       row       how one entry renders
       passed    toggle wording, given how many have gone
       intro     optional line under the heading
       empty     what to say when nothing is left
  ------------------------------------------------------------------------ */
  const SECTIONS = {
    stays: {
      host: "stayHost", toggleId: "stayPastToggle",
      heading: "🛏 Where everyone's staying",
      items: () => TRIP.accommodation,
      // Already written in date order, and a stay list reads as a sequence:
      // pulling checked-out ones to the bottom would scramble the dates.
      order: "given", opened: "given",
      past: (s, today) => !!(s.to && today > s.to),
      here: (s, today) => today >= s.from && today < s.to,
      passed: n => `${n} already checked out of`,
      row: stayRow,
    },

    bookings: {
      host: "bookingsCards", toggleId: "bookingsPastToggle",
      heading: "🎟 Bookings &amp; reservations",
      items: () => sortBookings((TRIP.bookings || []).filter(b => !b.considering)),
      // sortBookings has already put these in date order, and a record of what
      // was booked reads correctly that way whether or not it has happened.
      order: "given", opened: "given",
      past: (b, today) => !!(b.when && today > b.when),
      here: (b, today) => b.when === today,
      passed: n => `${n} already done`,
      empty: "Nothing left to turn up to.",
      row: bookingRow,
    },

    considering: {
      host: "consideringCards", toggleId: "consideringPastToggle",
      heading: "🤔 Being considered",
      items: () => (TRIP.bookings || []).filter(b => b.considering),
      order: "nearest", opened: "sink",
      past: (b, today) => !!(b.done || (b.to && today > b.to)),
      here: (b, today) => !!(b.from && b.to && today >= b.from && today <= b.to),
      passed: n => `${n} you've passed`,
      intro: () => `<p class="placeholder" style="margin-bottom:10px">Nothing here is booked — options for when a day needs filling.</p>`,
      empty: "Nothing left within reach.",
      row: bookingRow,
    },

    roadStops: {
      host: "roadStopCards", toggleId: "roadStopPastToggle",
      heading: "🛣 On the way",
      items: () => TRIP.roadStops,
      order: "nearest", opened: "sink",
      past: (e, today) => !!(e.done || (e.to && today > e.to)),
      here: (e, today) => !!(e.from && e.to && today >= e.from && today <= e.to),
      passed: n => `${n} you've passed`,
      intro: () => TRIP.roadStopsNote
        ? `<p class="placeholder" style="margin-bottom:10px">${tokEsc(TRIP.roadStopsNote)}</p>` : "",
      empty: "Nothing left on the route.",
      row: eatingRow,
    },

    eating: {
      host: "eatingCards", toggleId: "eatingPastToggle",
      heading: "🍖 Where to eat",
      items: () => TRIP.eating,
      order: "nearest", opened: "sink",
      // Undated entries never expire — they just sort last among the live ones.
      past: (e, today) => !!(e.done || (e.to && today > e.to)),
      here: (e, today) => !!(e.from && e.to && today >= e.from && today <= e.to),
      // "places" rather than a bare count, because this list is long enough
      // that the number alone reads as a date. The Show and Hide halves used
      // to disagree on this — one of the drifts that prompted the table.
      passed: n => `${n} place${n > 1 ? "s" : ""} you've passed`,
      intro: () => TRIP.eatingNote
        ? `<p class="placeholder" style="margin-bottom:10px">${tokEsc(TRIP.eatingNote)}</p>` : "",
      empty: "Nothing left on the list.",
      row: eatingRow,
    },
  };

  // The machinery, once. `showPast` is the toggle's state, not a property of
  // the section — it belongs to the render below.
  function sectionCard(spec, showPast){
    const list = spec.items();
    if (!Array.isArray(list) || !list.length) return "";
    const today = tripToday();

    const ranked = list.map((it, i) => ({
      it, i,
      past: !!spec.past(it, today),
      here: !!spec.here(it, today),
    }));

    if (spec.order === "nearest") ranked.sort((a, b) => {
      if (a.here !== b.here) return a.here ? -1 : 1;      // where you are, first
      const af = a.it.from || "9999", bf = b.it.from || "9999";
      if (af !== bf) return af < bf ? -1 : 1;             // then in trip order
      return a.i - b.i;                                   // then config order
    });

    const live  = ranked.filter(r => !r.past);
    const gone  = ranked.filter(r =>  r.past);
    const shown = !showPast ? live
                : spec.opened === "sink" ? pastOrder(ranked, live, gone)
                : ranked;

    const toggle = gone.length
      ? `<button class="past-days-toggle" id="${spec.toggleId}">${
          showPast ? "▾ Hide " : "▸ Show "}${spec.passed(gone.length)}</button>`
      : "";

    return `<div class="info-card"><h4>${spec.heading}</h4>
      ${spec.intro ? spec.intro() : ""}
      ${toggle}
      ${shown.map(r => spec.row(r.it, r.here)).join("")}
      ${!shown.length && spec.empty ? `<p class="placeholder">${spec.empty}</p>` : ""}</div>`;
  }

  /* Each section owns its host element so a toggle redraws just that card,
     rather than rebuilding the whole tab and throwing you back to the top of
     it. Re-binding on every draw is deliberate: the button is replaced by the
     innerHTML write, so the old listener goes with it. */
  function renderSection(name, showPast){
    const spec = SECTIONS[name];
    const el = $(spec.host);
    if (!el) return;
    el.innerHTML = sectionCard(spec, showPast);
    const btn = $(spec.toggleId);
    if (btn) btn.addEventListener("click", () => renderSection(name, !showPast));
  }

  function carCard(){
    const c = TRIP.carHire;
    if (!c || !c.pickUp) return "";
    const f = d => fmtAt(d, {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
    return `<div class="info-card"><h4>🚗 Car hire</h4>
      ${FLIGHTS.length ? "" : timeToggle()}
      ${c.vehicle?`<p style="margin-bottom:8px">${esc(c.vehicle)}</p>`:""}
      <div class="stay"><div class="stay-when">Pick up · ${f(c.pickUp.when)}</div>
        <div class="stay-name">${esc(c.pickUp.at)}</div>
        ${c.pickUp.address?`<div class="stay-note">${esc(c.pickUp.address)}</div>`:""}
        ${linkRow([c.pickUp.satNav && ["🧭 Directions", c.pickUp.satNav]])}</div>
      <div class="stay"><div class="stay-when">Drop off · ${f(c.dropOff.when)}</div>
        <div class="stay-name">${esc(c.dropOff.at)}</div>
        ${c.dropOff.address?`<div class="stay-note">${esc(c.dropOff.address)}</div>`:""}
        ${linkRow([c.dropOff.satNav && ["🧭 Directions", c.dropOff.satNav]])}</div>
      ${c.ref?`<p class="placeholder" style="font-size:calc(13px * var(--fs));margin:10px 0 0">Booking ref: <b>${esc(c.ref)}</b></p>`:""}
      ${costLine("carHire")}
      ${linkRow([
        c.appLink  && ["📱 Open " + (c.appName  || "app"), c.appLink,  c.appName],
        c.appLink2 && ["📱 Open " + (c.appName2 || "app"), c.appLink2, c.appName2],
      ])}
      ${c.note?`<p class="placeholder" style="font-size:calc(13px * var(--fs));margin:10px 0 0">${esc(c.note)}</p>`:""}</div>`;
  }

  function beforeCard(){
    const items = TRIP.beforeYouGo;
    if (status !== "before" || !Array.isArray(items) || !items.length) return "";
    return `<div class="info-card"><h4>✅ Before you go</h4>
      <ul style="margin:0 0 4px;padding-left:20px;font-size:calc(15px * var(--fs));line-height:1.7;color:var(--text-body)">
      ${items.map(i => `<li>${tok(i)}</li>`).join("")}</ul>
      ${TRIP.beforeYouGoNote?`<p class="placeholder" style="margin-top:8px">${tokEsc(TRIP.beforeYouGoNote)}</p>`:""}</div>`;
  }

  /* Contacts and links come from the published config and nothing else.
     They used to be editable in-app when `editable` was true, saving to that
     phone only — and the saved copy then won over the config for good, even
     after editing was switched off and the button had gone. A relative who
     tidied the emergency numbers once would never see a correction published
     after it. Anything a phone saved that way is cleared here, once. */
  ["tracker-url", "photos-url", "contacts"].forEach(k => {
    try { localStorage.removeItem(storeKey(k)); } catch(e){}
  });

  function linksCard(){
    if (TRIP.keepsake) {
      const route = L_.liveTracker || "";
      if (!route || (TRIP.trek && TRIP.trek.enabled)) return "";
      return `<div class="info-card"><h4>🛰 The route</h4>
        <a class="card-btn link" href="${esc(route)}" target="_blank" rel="noreferrer">The route on the satellite tracker ↗</a></div>`;
    }
    const live = L_.liveTracker || "";
    const any = live || L_.trackerPage || L_.messageBoard;
    if (!any) return "";
    const todayMap = currentDay && currentDay.lat != null
      ? `https://www.google.com/maps/search/?api=1&query=${currentDay.lat},${currentDay.lng}` : "";
    return `<div class="info-card"><h4>🛰 Links</h4>
      ${L_.portalNote?`<p class="placeholder" style="margin-bottom:10px">${tokEsc(L_.portalNote)}</p>`:""}
      <div class="portal-btn-group">
        ${live?`<a class="card-btn link portal-btn" style="background:var(--success)" href="${esc(live)}" target="_blank" rel="noreferrer">🛰 View Live Tracker ↗</a>`:""}
        ${todayMap?`<a class="card-btn link portal-btn" style="background:#fff;color:var(--primary);border:1.5px solid var(--primary)" href="${esc(todayMap)}" target="_blank" rel="noreferrer">📍 Today's area on Google Maps ↗</a>`:""}
        ${L_.trackerPage?`<a class="card-btn link portal-btn" href="${esc(L_.trackerPage)}" target="_blank" rel="noreferrer">Tracker portal page ↗</a>`:""}
        ${L_.messageBoard?`<a class="card-btn link portal-btn" style="background:var(--warning)" href="${esc(L_.messageBoard)}" target="_blank" rel="noreferrer">💬 Message Board ↗</a>`:""}
      </div>
      ${L_.trackerNote?`<p class="placeholder" style="margin:12px 0 8px">${tokEsc(L_.trackerNote)}</p>`:""}</div>`;
  }

  /* The trip's own photos: trips/<name>/gallery/, made by scripts/make-gallery.js
     and kept on the server beside the trip. Held here, not on a photo service,
     so they sit behind the same password as the rest of the app. If a trip has
     none, gallery.json does not exist and nothing shows. */
  let GALLERY = null;
  const GAL_DIR = (window.TRIP_DIR || "") + "gallery/";
  fetch(GAL_DIR + "gallery.json", { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(j => {
      if (!(j && j.photos && j.photos.length)) return;
      GALLERY = window.TRIP_GALLERY = j.photos;
      render();
      document.dispatchEvent(new Event("gallery-ready"));   // the map's photo pins
    })
    .catch(() => {});

  function galleryCard(){
    if (!GALLERY) return "";
    const first = GALLERY.slice(0, 6);
    return `<div class="info-card"><h4>📷 Photos</h4>
      <div class="gal-strip">${first.map((p, i) => `<button type="button" class="gal-th" data-gal="${i}"><img src="${esc(GAL_DIR + "t/" + p.f)}" alt="" loading="lazy"></button>`).join("")}</div>
      ${L_.photosNote?`<p class="placeholder">${tokEsc(L_.photosNote)}</p>`:""}
      <button type="button" class="card-btn" data-gal="0">See all ${GALLERY.length} photos</button>
      ${L_.photos?` <a class="card-btn link secondary" href="${esc(L_.photos)}" target="_blank" rel="noreferrer">Open ${esc(L_.photosLabel||"album")} ↗</a>`:""}</div>`;
  }

  function openGallery(start){
    if (!GALLERY) return;
    let cur = -1;
    const o = document.createElement("div");
    o.className = "gal-over";
    o.innerHTML = `<div class="gal-bar"><b>📷 ${GALLERY.length} photos</b><button type="button" class="gal-x" aria-label="Close">✕</button></div>
      <div class="gal-grid">${GALLERY.map((p, i) => `<button type="button" class="gal-cell" data-i="${i}"><img src="${esc(GAL_DIR + "t/" + p.f)}" alt="" loading="lazy"></button>`).join("")}</div>
      <div class="gal-big" hidden><button type="button" class="gal-x" aria-label="Back to all photos">✕</button>
        <button type="button" class="gal-nav prev" aria-label="Previous">‹</button><img alt="">
        <button type="button" class="gal-nav next" aria-label="Next">›</button>
        <div class="gal-cap"><span></span><a download>Save</a></div></div>`;
    document.body.appendChild(o);
    document.body.style.overflow = "hidden";
    const big = o.querySelector(".gal-big"), img = big.querySelector("img"), cap = big.querySelector(".gal-cap span"), dl = big.querySelector("a");
    const show = i => {
      cur = (i + GALLERY.length) % GALLERY.length;
      const p = GALLERY[cur];
      img.src = GAL_DIR + p.f;
      dl.href = GAL_DIR + p.f; dl.download = (TRIP.trip.title || "photo").replace(/[^\w-]+/g, "-") + "-" + p.f;
      const d = new Date(p.taken);
      cap.textContent = (isNaN(d) ? "" : d.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "long" }) + " · ") + (cur + 1) + " of " + GALLERY.length;
      big.hidden = false;
      // The next one is fetched ahead so swiping is not a wait.
      const nx = new Image(); nx.src = GAL_DIR + GALLERY[(cur + 1) % GALLERY.length].f;
    };
    const close = () => { document.removeEventListener("keydown", key); document.body.style.overflow = ""; o.remove(); };
    const key = e => {
      if (e.key === "Escape") { big.hidden ? close() : (big.hidden = true); }
      else if (!big.hidden && e.key === "ArrowRight") show(cur + 1);
      else if (!big.hidden && e.key === "ArrowLeft") show(cur - 1);
    };
    document.addEventListener("keydown", key);
    o.addEventListener("click", e => {
      const t = e.target.closest("button"); if (!t) return;
      if (t.classList.contains("gal-cell")) show(+t.dataset.i);
      else if (t.classList.contains("next")) show(cur + 1);
      else if (t.classList.contains("prev")) show(cur - 1);
      else if (t.classList.contains("gal-x")) { big.contains(t) ? (big.hidden = true) : close(); }
    });
    let x0 = null;
    big.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
    big.addEventListener("touchend", e => {
      if (x0 == null) return;
      const dx = e.changedTouches[0].clientX - x0; x0 = null;
      if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    });
    if (start != null && start >= 0) show(start);
  }
  window.openGallery = openGallery;

  function photosCard(){
    const url = L_.photos || "";
    if (!url || GALLERY) return "";     // with the trip's own photos, the link is in that card
    return `<div class="info-card"><h4>📷 Photos</h4>
      ${L_.photosNote?`<p class="placeholder">${tokEsc(L_.photosNote)}</p>`:""}
      <a class="card-btn link" href="${esc(url)}" target="_blank" rel="noreferrer">Open ${esc(L_.photosLabel||"album")} ↗</a></div>`;
  }

  function contactsCard(){
    const txt = TRIP.contacts || "";
    if (!txt) return "";
    return `<div class="info-card"><h4>🆘 Emergency &amp; key contacts</h4>
      <p>${tokEsc(txt)}</p></div>`;
  }

  function whoCard(){
    if (!TRIP.editable) return "";
    return `<div class="info-card"><h4>⚙️ Whose trip is this?</h4>
      <p class="placeholder">Currently set up for ${esc(NAME)} (${esc(PKEY)}).</p>
      <button type="button" class="ghost-btn" id="editWho">Change name / pronouns</button></div>`;
  }

  function render(){
    // Bookings moved to their own tab — with flights, six stays, the car and
    // fifteen reservations, the Info tab had become a scroll rather than a
    // reference. Info keeps where you're sleeping and how you're travelling;
    // Bookings keeps what you've paid for and need to turn up to.
    $("infoCards").innerHTML = (TRIP.keepsake ? galleryCard() : "") + whoCard() + beforeCard() + flightsCard() + calendarCard() + stayCard() + carCard()
                             + costsCard() + linksCard() + (TRIP.keepsake ? "" : galleryCard()) + photosCard() + contactsCard();
    // Hiding what's done is right while the trip is running — it keeps the
    // lists to what's still ahead of you. Once it's over, every window has
    // passed, so the same rule empties every section and the app becomes five
    // cards saying "nothing left" on the day it turns into the record of the
    // trip. After the last day, open them all instead.
    const done = status === "after";
    Object.keys(SECTIONS).forEach(name => renderSection(name, done));
    bind();
    updateLiveFlights();
  }

  // Kept out of render() so the toggle can redraw just this tab without
  // rebuilding — and losing the scroll position of — the whole Info tab.
  function bind(){
    document.querySelectorAll("[data-gal]").forEach(b => b.addEventListener("click", () => openGallery(+b.dataset.gal)));
    document.querySelectorAll(".time-mode").forEach(b => b.addEventListener("click", () => {
      localStorage.setItem(TIME_KEY, b.dataset.mode);
      render();
    }));

    const w = $("editWho");
    if (w) w.addEventListener("click", () => {
      const card = w.closest(".info-card");
      card.innerHTML = `<h4>⚙️ Whose trip is this?</h4>
        <input type="text" id="whoName" value="${esc(NAME)}" aria-label="Name">
        <select id="whoP" style="width:100%;padding:8px 10px;border-radius:8px;border:1.5px solid var(--border-strong);margin-bottom:8px">
          <option value="he" ${PKEY==="he"?"selected":""}>He / him</option>
          <option value="she" ${PKEY==="she"?"selected":""}>She / her</option>
          <option value="they" ${PKEY==="they"?"selected":""}>They / them</option>
        </select>
        <button type="button" class="card-btn" id="whoSave">Save</button>
        <button type="button" class="ghost-btn" id="whoCancel" style="margin-left:8px">Cancel</button>`;
      $("whoSave").addEventListener("click", () => {
        localStorage.setItem(storeKey("traveller"), $("whoName").value.trim() || TRIP.trip.traveller);
        localStorage.setItem(storeKey("pronoun"), $("whoP").value);
        location.reload();
      });
      $("whoCancel").addEventListener("click", render);
    });
  }

  __liveOnChange = render;
  // The calendar card changes to "Subscribe" once calendar.json has arrived.
  document.addEventListener("calendar-ready", render);
  render();
  // Refresh live status periodically — a tab left open for hours goes stale.
  // The server updates the file at most every ten minutes.
  setInterval(() => updateLiveFlights(true), 5*60*1000);
})();

/* --- Messages ------------------------------------------------------------- */
(function(){
  const M = TRIP.messages || {};
  const NOTES = storeKey("notes");
  $("messagesHeading").textContent = tok(M.heading || "Notes");
  // Be straight about where these live. They're in this browser's storage only —
  // there's no server — so each person writing on their own phone builds their
  // own private list. Without saying so, someone reasonably assumes the family's
  // messages are pooled, and they aren't.
  $("notesHint").innerHTML = esc(tok(M.hint || ""))
    + `<br><span style="font-size:calc(14px * var(--fs));opacity:.85">Saved on this device only — other people's messages won't appear here,
       and these will be lost if you clear your browser data. Use <b>Export as text</b> to keep or share them.</span>`;
  $("noteInput").placeholder = tok(M.placeholder || "");
  $("printHeading").textContent = tok(M.heading || "Notes");

  const prompts = (M.prompts || []).map(tok);
  if (prompts.length){
    // Same prompt all day, different each day — deterministic on the date so it
    // doesn't shuffle every time the page is opened.
    const idx = Math.abs(new Date().toISOString().slice(0,10).split("-").join("") | 0) % prompts.length;
    $("promptChip").innerHTML = `<div class="prompt-chip">💭 Today's prompt: ${esc(prompts[idx])}</div>`;
  }

  const load = () => { try { return JSON.parse(localStorage.getItem(NOTES) || "[]"); } catch(e){ return []; } };
  const save = n => localStorage.setItem(NOTES, JSON.stringify(n));

  function render(){
    const notes = load(), el = $("notesList");
    if (!notes.length){ el.innerHTML = `<p class="notes-hint">No messages yet — add the first one above.</p>`; return; }
    el.innerHTML = notes.map((n,i) => `<div class="note-item"><div class="note-item-row">
        <div class="note-text">${esc(n.text)}</div>
        <button class="note-delete" data-i="${i}" aria-label="Delete message">✕</button></div>
        <div class="note-date">${esc(n.date)}</div></div>`).join("");
    el.querySelectorAll(".note-delete").forEach(b => b.addEventListener("click", () => {
      const n = load(); n.splice(+b.dataset.i, 1); save(n); render();
    }));
  }

  $("saveNote").addEventListener("click", () => {
    const t = $("noteInput").value.trim();
    if (!t) return;
    const n = load();
    n.unshift({ text:t, date:new Date().toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) });
    save(n); $("noteInput").value = ""; render();
  });

  $("exportNotes").addEventListener("click", () => {
    const n = load();
    if (!n.length) return;
    const body = n.map(x => `${x.date}\n${x.text}\n`).join("\n");
    const blob = new Blob([`${tok(M.heading||"Notes")}\n\n${body}`], { type:"text/plain" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (TRIP.storagePrefix || "trip-") + "messages.txt";
    a.click(); URL.revokeObjectURL(a.href);
  });
  $("printNotes").addEventListener("click", () => window.print());

  render();
})();

/* --- Tabs ----------------------------------------------------------------- */
(function(){
  const TABKEY = storeKey("tab");
  const defs = [
    { id:"overview",  label:"🧭 Overview" },
    { id:"info",      label:"ℹ️ Info" },
    { id:"bookings",  label:"🎟 Bookings", when:() => (TRIP.bookings||[]).some(b => !b.considering) },
    { id:"eating",    label:"🍖 Eating", when:() => Array.isArray(TRIP.eating) && TRIP.eating.length > 0 },
    { id:"roadstops", label:"🛣 On the way", when:() => Array.isArray(TRIP.roadStops) && TRIP.roadStops.length > 0 },
    { id:"considering", label:"🤔 Considering", when:() => (TRIP.bookings||[]).some(b => b.considering) },
    { id:"map",       label:"🗺️ Map",  when:() => !!map },
    { id:"trek",      label:"🥾 Trek", when:() => !!(TRIP.trek && TRIP.trek.enabled) },
    { id:"itinerary", label:"📅 Itinerary" },
    { id:"messages",  label:"💬 Messages" },
  ].filter(t => !t.when || t.when());

  // Drop panels for tabs this trip doesn't have, so nothing orphaned lingers.
  document.querySelectorAll(".tab-panel").forEach(p => {
    if (!defs.some(d => d.id === p.dataset.tab)) p.remove();
  });

  $("tabbar").innerHTML = defs.map(t =>
    `<button type="button" class="tab-btn" role="tab" data-tab="${t.id}" id="tabbtn-${t.id}">${t.label}</button>`).join("");

  const buttons = [...document.querySelectorAll(".tab-btn")];
  const panels  = [...document.querySelectorAll(".tab-panel")];

  function activate(tab, opts){
    opts = opts || {};
    buttons.forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab ? "true" : "false"));
    panels.forEach(p => p.classList.toggle("active", p.dataset.tab === tab));
    if (tab === "map" && map){
      // Leaflet can't measure a display:none container, and this panel was
      // hidden when the map was created — re-measure now it's visible.
      setTimeout(() => {
        map.invalidateSize(); if (routeBounds) map.fitBounds(routeBounds);
        if (typeof window.__positionMapResizeHandle === "function") window.__positionMapResizeHandle();
      }, 50);
    }
    if (!opts.skipSave) { try { localStorage.setItem(TABKEY, tab); } catch(e){} }
    window.scrollTo({ top:0, behavior:"auto" });
  }

  buttons.forEach(b => b.addEventListener("click", () => activate(b.dataset.tab)));
  const saved = localStorage.getItem(TABKEY);
  activate(defs.some(d => d.id === saved) ? saved : "overview", { skipSave:true });
})();

/* --- Service worker ------------------------------------------------------- */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>

<script>
/* ===========================================================================
   DEMO CONTROLS — the scrubber, and the scripted-update panel.

   Renders only when the demo clock above activated, so it cannot appear on a
   real trip. Runs last, after the engine has painted: it only adds chrome and
   never touches what the engine rendered.

   The scrubber sets ?demo=<date> and reloads rather than re-rendering in place.
   That is deliberate — see the comment on the demo clock. A reload is close to
   instant on a service-worker-cached static site, and it guarantees every part
   of the page agrees about what day it is. Re-rendering in place would mean
   making 17 load-time IIFEs re-callable, and any one missed would leave part of
   the page silently on the old date in front of a client.
   =========================================================================== */
(function(){
  var DEMO = window.__DEMO__;
  if (!DEMO) return;

  var days = TRIP.days || [];
  if (!days.length) return;
  var cfg = DEMO.cfg;

  function addDays(ds, n){
    var d = new Date(ds + "T12:00:00Z");     // noon UTC: immune to DST either side
    d.setUTCDate(d.getUTCDate() + n);
    return d.toISOString().slice(0, 10);
  }
  function diffDays(a, b){
    return Math.round((new Date(b + "T12:00:00Z") - new Date(a + "T12:00:00Z")) / 864e5);
  }
  function pretty(ds){
    return new Date(ds + "T12:00:00Z").toLocaleDateString("en-GB",
      { weekday:"short", day:"numeric", month:"short", timeZone:"UTC" });
  }

  var rangeStart = addDays(days[0].date, -(cfg.padBeforeDays || 5));
  var rangeEnd   = addDays(days[days.length-1].date, cfg.padAfterDays || 3);
  var span       = diffDays(rangeStart, rangeEnd);
  var current    = Math.min(Math.max(diffDays(rangeStart, DEMO.date), 0), span);

  /* What the app is showing on a given date, in the same terms the app uses. */
  function dayLabel(ds){
    for (var i = 0; i < days.length; i++){
      if (days[i].date === ds) return "Day " + days[i].n + " of " + days.length;
    }
    if (ds < days[0].date) {
      var n = diffDays(ds, days[0].date);
      return n === 1 ? "1 day before departure" : n + " days before departure";
    }
    return "After the trip";
  }

  function go(params){
    var u = new URL(location.href);
    Object.keys(params).forEach(function(k){
      if (params[k] === null) u.searchParams.delete(k);
      else u.searchParams.set(k, params[k]);
    });
    location.href = u.toString();
  }

  var css = document.createElement("style");
  css.textContent = [
    /* Deliberately OUTSIDE the trip palette. This bar was drawn in
       --primary-deep and --accent, which is to say it looked like a feature of
       the app rather than a rig sitting on top of one. In front of a client
       that is a real risk: an operator's scrubber and a "Publish it" button
       are exactly the things a viewer must not think parents are given.

       So: cool charcoal against the app's warm greens and creams, monochrome
       controls, and a single amber marker on the DEMO pill and the live
       indicator. Nothing here reads as belonging to the trip. The tokens are
       local to #demoBar so the trip theme cannot reach in and the bar cannot
       leak out. */
    "#demoBar{--d-bg:#23272E;--d-fg:#E7E9EC;--d-mark:#F2B441;--d-line:rgba(231,233,236,.22);}",
    "#demoBar{position:fixed;left:0;right:0;bottom:0;z-index:9000;background:var(--d-bg);",
      "color:var(--d-fg);padding:10px 14px calc(10px + env(safe-area-inset-bottom));",
      "border-top:2px solid var(--d-mark);",
      "box-shadow:0 -4px 18px rgba(0,0,0,.28);font-family:'Inter',sans-serif;}",
    "#demoBar .row{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;flex-wrap:wrap;}",
    "#demoBar .pill{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1.5px;",
      "text-transform:uppercase;color:var(--d-bg);background:var(--d-mark);",
      "border-radius:20px;padding:4px 10px;font-weight:700;flex-shrink:0;}",
    "#demoBar .when{font-size:14px;font-weight:600;line-height:1.25;flex:1;min-width:150px;}",
    "#demoBar .when small{display:block;font-weight:400;opacity:.75;font-size:12px;}",
    "#demoScrub{width:100%;accent-color:var(--d-mark);height:32px;cursor:grab;}",
    "#demoBar .btn{background:var(--d-fg);color:var(--d-bg);border:none;border-radius:20px;",
      "padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;",
      "min-height:40px;flex-shrink:0;}",
    "#demoBar .btn.ghost{background:transparent;color:var(--d-fg);border:1.5px solid var(--d-line);}",
    "#demoBar .live{font-size:12px;font-weight:700;color:var(--d-mark);flex-shrink:0;}",
    "#demoBar .story{border-top:1px solid var(--d-line);margin-top:8px;padding-top:8px;}",
    "#demoBar .beat{flex:1;min-width:170px;font-size:13px;line-height:1.35;}",
    "#demoBar .beat b{color:var(--d-mark);}",
    "#demoBar .beat small{display:block;opacity:.72;font-size:11.5px;margin-top:2px;}",
    "#demoBar .dots{display:flex;gap:6px;flex-shrink:0;}",
    "#demoBar .dots button{width:11px;height:11px;padding:0;border-radius:50%;cursor:pointer;",
      "border:1.5px solid var(--d-line);background:transparent;}",
    "#demoBar .dots button[aria-current='true']{background:var(--d-fg);border-color:var(--d-fg);}",
    "#demoBar .nav{background:transparent;color:var(--d-fg);border:1.5px solid var(--d-line);",
      "border-radius:20px;min-width:44px;min-height:40px;font-size:15px;cursor:pointer;flex-shrink:0;}",
    "#demoBar .nav[disabled]{opacity:.3;cursor:default;}",
    "#demoBar .lbl-short{display:none;}",
    "#demoSheet{position:fixed;inset:0;z-index:9001;background:rgba(0,0,0,.55);display:flex;",
      "align-items:center;justify-content:center;padding:20px;}",
    "#demoSheet .card{background:var(--surface);color:var(--text);border-radius:16px;padding:20px;",
      "max-width:620px;width:100%;max-height:84vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.4);}",
    "#demoSheet h3{font-family:'Fraunces',serif;margin:0 0 6px;font-size:20px;}",
    "#demoSheet p{margin:0 0 14px;font-size:14px;line-height:1.55;color:var(--text-body);}",
    "#demoSheet .file{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-muted);",
      "margin-bottom:6px;letter-spacing:.5px;}",
    "#demoSheet pre{background:#12211A;border-radius:10px;padding:12px;overflow-x:auto;margin:0 0 16px;",
      "font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.6;}",
    "#demoSheet pre span{display:block;white-space:pre;color:#C9C3B4;}",
    "#demoSheet pre span.add{background:rgba(88,200,120,.16);color:#8FE0A8;}",
    "#demoSheet pre span.del{background:rgba(230,90,90,.16);color:#F0A0A0;}",
    /* On a phone the bar was taking 37% of the viewport, mostly the presenter
       note wrapping to six lines. That note is a prompt for whoever is talking
       over the demo, not something a viewer on their own phone needs — and the
       app underneath is the thing being judged. Drop it, and shorten the
       longest button labels, below the width where the row stops fitting. */
    "@media (max-width:560px){",
      "#demoBar .beat small{display:none;}",
      "#demoBar .beat{min-width:0;font-size:12.5px;}",
      "#demoBar .lbl-long{display:none;}",
      "#demoBar .lbl-short{display:inline;}",
      "#demoBar{padding-top:8px;}",
      "#demoBar .row{gap:10px;}",
    "}",
    /* On a wide screen the app is a centred column with a lot of empty page
       either side of it, and a full-width bar across the bottom was covering
       the fold of that column — on the opening beat it sat over Key moments —
