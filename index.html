       for no reason other than that phones need it there.

       So above the width where the dead space appears, it becomes a card
       floating in it: bottom right, clear of the content, and reading much
       more like a tool parked next to the app than a strip attached to it.
       Everything below this width is untouched. */
    /* The panel takes its own width and the page makes room for it, rather
       than the panel squeezing into whatever gutter a 640px centred column
       happens to leave. Sizing it from the leftover space needed a ~1280px
       window before it would fit — which a 1920px laptop at 175% Windows
       scaling is not, so the bar stayed at the bottom on exactly the machine
       this is presented from. Reserving the space instead means it works from
       1060px up, and the column simply re-centres in what is left. */
    "@media (min-width:1060px){",
      ":root{--demo-w:min(360px, 26vw);}",
      "body{padding-right:calc(var(--demo-w) + 44px);}",
      "#demoBar{left:auto;right:22px;bottom:22px;border-radius:14px;",
        "width:var(--demo-w);",
        "max-height:calc(100vh - 44px);overflow-y:auto;",
        "border:2px solid var(--d-mark);padding:16px;",
        "box-shadow:0 10px 34px rgba(0,0,0,.34);}",
      "#demoBar .row{max-width:none;gap:10px;}",
      "#demoBar .when{flex:1 1 100%;}",
      "#demoBar .btn{flex:1 1 auto;}",
      // Beat text onto its own line above the controls, so ◀ and ▶ stay
      // together on the row beneath rather than being pushed apart by it.
      "#demoBar .beat{order:-1;flex:0 0 100%;min-width:0;}",
      "#demoBar .dots{flex:1;justify-content:center;}",
    "}",
    "@media print{#demoBar,#demoSheet{display:none!important;}}"
  ].join("");
  document.head.appendChild(css);

  var bar = document.createElement("div");
  bar.id = "demoBar";
  document.body.appendChild(bar);

  var story = Array.isArray(cfg.story) && cfg.story.length ? cfg.story : null;

  /* The running order. Shown collapsed to a single "play" button until you're
     in it, so free scrubbing isn't cluttered by controls for a mode you left. */
  function storyRow(){
    if (!story) return "";
    var b = DEMO.beat;
    if (!b){
      return '<div class="row story">' +
        '<span class="beat" style="opacity:.75">Six stops, in order — the ninety-second version.</span>' +
        '<button type="button" class="btn" id="demoPlay">▶ Play the story</button></div>';
    }
    var s    = story[b - 1];
    var next = story[b];
    return '<div class="row story">' +
      '<button type="button" class="nav" id="demoPrev" aria-label="Previous stop"' +
        (b === 1 ? " disabled" : "") + ">◀</button>" +
      '<span class="beat"><b>' + b + " of " + story.length + " · " + s.label + "</b>" +
        (s.note ? "<small>" + s.note + "</small>" : "") + "</span>" +
      '<span class="dots">' + story.map(function(x, i){
        return '<button type="button" data-beat="' + (i+1) + '"' +
               (i+1 === b ? ' aria-current="true"' : "") +
               ' aria-label="' + (i+1) + ". " + x.label + '"></button>';
      }).join("") + "</span>" +
      '<button type="button" class="btn" id="demoNext">' +
        (next ? 'Next<span class="lbl-long">: ' + next.label + "</span> ▶"
              : '↺ Start again') + "</button>" +
    "</div>";
  }

  function wireStory(){
    if (!story) return;
    var play = document.getElementById("demoPlay");
    if (play) play.addEventListener("click", function(){ go({ beat: 1, demo: null, update: null }); });

    var prev = document.getElementById("demoPrev");
    if (prev) prev.addEventListener("click", function(){
      if (DEMO.beat > 1) go({ beat: DEMO.beat - 1, demo: null, update: null });
    });

    var next = document.getElementById("demoNext");
    if (next) next.addEventListener("click", function(){
      var to = DEMO.beat >= story.length ? 1 : DEMO.beat + 1;
      go({ beat: to, demo: null, update: null });
    });

    [].forEach.call(document.querySelectorAll("#demoBar .dots button"), function(d){
      d.addEventListener("click", function(){
        go({ beat: d.dataset.beat, demo: null, update: null });
      });
    });
  }

  function paintBar(){
    // The next change not yet published, and only if the trip has reached the
    // day it happened. Null means there is nothing to offer right now.
    var up = DEMO.updates[DEMO.published];
    var nextEdit = (up && (!up.onDate || DEMO.date >= up.onDate)) ? up : null;

    bar.innerHTML =
      '<div class="row">' +
        '<span class="pill">Demo</span>' +
        '<span class="when" id="demoWhen">' + pretty(DEMO.date) +
          '<small>' + dayLabel(DEMO.date) + '</small></span>' +
        /* Not either/or any more. Mid-story the usual state is "one change is
           live and another is waiting", so the live badge, Revert and the next
           edit all have to be able to sit on the bar together. */
        (DEMO.published
          ? '<span class="live">● ' + (DEMO.published > 1 ? DEMO.published + " updates" : "Update") + ' live</span>' +
            '<button type="button" class="btn ghost" id="demoRevert">Revert</button>'
          : "") +
        /* Only once the trip has actually reached the day the change happened.
           Publishing the Dubai delay from "three days out" put the team in an
           airport hotel before they had left, and stamped the footer "last
           updated 19 Jul" while the viewer was standing on the 14th — a date
           in the future, which is the one detail in this app most likely to
           be noticed and least likely to be forgiven. */
        (nextEdit
          ? '<button type="button" class="btn" id="demoShowEdit">' +
            '<span class="lbl-long">Show the operator’s edit</span>' +
            '<span class="lbl-short">Operator’s edit</span></button>'
          : "") +
      '</div>' +
      '<div class="row" style="margin-top:2px">' +
        '<label for="demoScrub" style="position:absolute;left:-9999px">Move the trip date</label>' +
        '<input type="range" id="demoScrub" min="0" max="' + span + '" value="' + current + '">' +
      '</div>' +
      storyRow();

    wireStory();

    var scrub = document.getElementById("demoScrub");
    var when  = document.getElementById("demoWhen");

    /* Label follows the thumb live; the reload waits for `change`. Binding the
       reload to `input` would fire on every pixel of the drag. */
    scrub.addEventListener("input", function(){
      var ds = addDays(rangeStart, +scrub.value);
      when.innerHTML = pretty(ds) + "<small>" + dayLabel(ds) + "</small>";
    });
    /* Scrubbing leaves the running order: an arbitrary date is not a beat, and
       carrying `beat` forward would make the story controls describe a stop you
       are no longer standing on. `update` is preserved deliberately — having
       published the change, you should be able to scrub around and see that it
       persists. */
    scrub.addEventListener("change", function(){
      var ds = addDays(rangeStart, +scrub.value);
      if (ds === DEMO.date) return;
      go({ demo: ds, beat: null, update: DEMO.published ? String(DEMO.published) : null });
    });

    /* Reverts everything, not just the last one. In front of an audience
       "Revert" means "put it back how it was" — unwinding one change at a time
       would be a second thing to explain, mid-pitch, for no gain. */
    var revert = document.getElementById("demoRevert");
    if (revert) revert.addEventListener("click", function(){ go({ update: null }); });
    var show = document.getElementById("demoShowEdit");
    if (show) show.addEventListener("click", openSheet);
  }

  function openSheet(){
    // The next one that has not gone out yet — the running order and the
    // published count between them decide which edit is on the table.
    var u = DEMO.updates[DEMO.published];
    if (!u) return;
    var sheet = document.createElement("div");
    sheet.id = "demoSheet";
    sheet.innerHTML =
      '<div class="card" role="dialog" aria-modal="true" aria-label="Operator edit">' +
        "<h3>" + u.label + "</h3>" +
        "<p>" + u.blurb + "</p>" +
        '<div class="file">trip-config.js</div>' +
        "<pre>" + (u.diff || []).map(function(l){
          var cls  = l.type === "add" ? "add" : l.type === "del" ? "del" : "";
          var sign = l.type === "add" ? "+" : l.type === "del" ? "-" : " ";
          var safe = String(l.text).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
          return '<span class="' + cls + '">' + sign + safe + "</span>";
        }).join("") + "</pre>" +
        '<p>That is the whole change: one file, edited and republished. Every parent ' +
        'sees it the next time the app loads — no app-store update, nothing for them to do.</p>' +
        '<button type="button" class="btn" id="demoPublish" style="background:var(--primary);color:var(--bg)">' +
          "Publish it</button> " +
        '<button type="button" class="btn ghost" id="demoClose" ' +
          'style="background:transparent;color:var(--text-body);border:1.5px solid var(--border-strong)">' +
          "Close</button>" +
      "</div>";
    document.body.appendChild(sheet);

    document.getElementById("demoPublish").addEventListener("click", function(){
      // Inside a beat, the beat already fixes the date — adding `demo` would be
      // a parameter that `beat` overrides on the next load, i.e. pure noise in
      // a URL someone may well be looking at on a projector.
      var now = String(DEMO.published + 1);
      if (DEMO.beat) go({ update: now });
      else go({ update: now, demo: u.onDate || DEMO.date });
    });
    function close(){ sheet.remove(); }
    document.getElementById("demoClose").addEventListener("click", close);
    sheet.addEventListener("click", function(e){ if (e.target === sheet) close(); });
    document.addEventListener("keydown", function esc(e){
      if (e.key === "Escape"){ close(); document.removeEventListener("keydown", esc); }
    });
  }

  paintBar();

  /* Reserve exactly the space the bar occupies. Measured rather than fixed: the
     row wraps to two or three lines on a narrow screen, and a hardcoded value
     that clears it on desktop clips the footer on a phone.

     Only when it IS a bottom bar, though. As a side panel it covers nothing,
     and reserving its height left a 400px hole under the footer. Detected by
     measuring rather than by repeating the breakpoint here, so the CSS stays
     the single place that decides which layout is in use. */
  function reserveSpace(){
    var full = bar.offsetWidth >= document.documentElement.clientWidth - 1;
    document.body.style.paddingBottom = full ? (bar.offsetHeight + 24) + "px" : "";
  }
  reserveSpace();
  window.addEventListener("resize", reserveSpace);
})();
</script>
</body>
</html>
